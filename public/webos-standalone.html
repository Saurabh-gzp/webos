        const t = new Date().toLocaleTimeString();
        S.log.unshift(`[${t}] ${kind ? kind + ' · ' : ''}${msg}`);
        if (S.log.length > 300) S.log.pop();
        logOut.textContent = S.log.join('\n');
      }
      function show(obj) {
        out.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
      }
      function setDot(state, title) {
        dot.className = 'cr-dot ' + state;
        dot.title = title || '';
      }
      function setOverlay(txt) {
        overlay.textContent = txt || '';
        overlay.style.display = txt ? 'flex' : 'none';
      }
      /* status bar: hamesha "title · url" — title purane page ka na chipka rahe */
      function setStatus(title, url) {
        if (title !== undefined && title !== null) S.title = title;
        if (url) { S.urlLast = url; omni.value = url; }
        el('[data-cr="st-url"]', root).textContent =
          (S.title ? S.title + '  ·  ' : '') + (S.urlLast || '—');
      }

      /* ---------------- local (standalone) mode notice ---------------- */
      if (localMode() && !apiBase()) {
        root.innerHTML = `
<div class="cr-nolocal">
  <h3>🌐 Real Chromium — server mode chahiye</h3>
  <p>Ye file browser me akeli chal rahi hai (single-file build), isliye koi Chromium host nahi hai.
     Asli browser chahiye to WebOS ko server ke saath chalao (<code>node server.js</code>) — ya apne
     deployed server ka URL yahan daal do, phir wahi remote Chromium live dikhega.</p>
  <div class="cr-row">
    <input class="cr-remote" placeholder="https://webos-inte.onrender.com" spellcheck="false">
    <button class="cr-run">Connect</button>
  </div>
  <p class="cr-hint">Local URL: <code>http://localhost:3000</code> — server band ho to error aayega.</p>
</div>`;
        const inp = el('.cr-remote', root);
        try { inp.value = localStorage.getItem('webos.remote') || ''; } catch (e) {}
        el('.cr-run', root).onclick = () => {
          try { localStorage.setItem('webos.remote', inp.value.trim()); } catch (e) {}
          WebOS.notify('Chromium', 'Remote server set: ' + (inp.value.trim() || '(khali)'));
          a.close && a.close();
        };
        return;
      }

      /* ================= session + live stream ================= */
      async function refreshSessions(selectId) {
        const r = await jfetch('/api/browser/status');
        const st = r.data || {};
        const list = st.sessions || [];
        sessSel.innerHTML = list.length
          ? list.map(s => `<option value="${esc(s.id)}">${esc(s.id)}${s.title ? ' — ' + esc(String(s.title).slice(0, 40)) : ''}</option>`).join('')
          : '<option value="">(koi session nahi)</option>';
        if (selectId) sessSel.value = selectId;
        S.sessionId = sessSel.value || null;
        setDot(st.running ? 'on' : 'idle', st.version || (st.lastError || ''));
        return st;
      }

      async function newSession(url, vp) {
        setOverlay('Chromium launch ho raha hai…');
        const [w, h] = (vp || el('[data-cr="viewport"]', root).value || '1280x800').split('x').map(Number);
        const r = await jfetch('/api/browser', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ url: url || 'about:blank', width: w, height: h })
        });
        if (!r.data || r.data.ok === false) {
          setOverlay('Chromium nahi chala: ' + ((r.data && r.data.error) || r.status));
          setDot('err', (r.data && r.data.error) || 'error');
          log('session fail: ' + JSON.stringify(r.data), 'error');
          return null;
        }
        S.sessionId = r.data.sessionId;
        S.viewport = r.data.viewport || { width: w || 1280, height: h || 800 };
        await refreshSessions(S.sessionId);
        attachStream(S.sessionId);
        setStatus(r.data.title, r.data.url);
        setOverlay('');
        log('session ' + S.sessionId + ' → ' + (r.data.url || ''), 'open');
        afterAction(r.data);
        return S.sessionId;
      }

      function attachStream(id) {
        if (S.stream) { try { S.stream.close(); } catch (e) {} S.stream = null; }
        if (S.polling) { clearInterval(S.polling); S.polling = null; }
        if (!id) return;
        try {
          const es = new EventSource(apiUrl('/api/browser/' + id + '/stream'));
          S.stream = es;
          es.onmessage = (ev) => {
            let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
            if (d.type === 'frame' && d.jpeg) {
              screen.src = 'data:image/jpeg;base64,' + d.jpeg;
              S.frames++; S.frameAt = Date.now();
            } else if (d.type === 'nav') {
              setStatus(d.title, d.url);
            } else if (d.type === 'hello') {
              S.viewport = d.viewport || S.viewport;
              setOverlay('');
            } else if (d.type === 'closed' || d.type === 'browser-closed') {
              setOverlay('Session band ho gaya');
              log('stream: ' + d.type, 'warn');
            }
          };
          es.onerror = () => { /* EventSource khud reconnect karta hai */ };
        } catch (e) {
          log('stream error: ' + e.message, 'error');
        }
        // fallback: SSE se frames na aayein to /frame se poll karo (~2 fps)
        S.polling = setInterval(async () => {
          if (Date.now() - S.frameAt < 2500) return;
          if (!S.sessionId || S.busy) return;
          try {
            const r = await jfetch('/api/browser/' + S.sessionId + '/frame');
            if (r.data && r.data.jpeg) { screen.src = 'data:image/jpeg;base64,' + r.data.jpeg; S.frameAt = Date.now(); S.frames++; }
          } catch (e) {}
        }, 2000);
      }

      setInterval(() => {
        const fps = Math.round(S.frames / 5);
        S.frames = 0;
        el('[data-cr="st-fps"]', root).textContent = fps + ' fps';
      }, 5000);

      /* ---------------- response handling ---------------- */
      function afterAction(data) {
        if (!data) return;
        if (data.url !== undefined) setStatus(data.title, data.url);
        if (data.elements) { S.elements = data.elements; renderElements(data.elements); }
        if (data.text) { S.text = data.text; }
        if (data.service_worker === undefined && data.ok === false) log('action fail: ' + (data.error || ''), 'error');
      }

      function renderElements(list) {
        if (!list || !list.length) { elsBox.innerHTML = '<div class="cr-hint">koi element nahi mila</div>'; return; }
        elsBox.innerHTML = list.slice(0, 200).map(e => `
<div class="cr-el" data-ref="${esc(e.ref)}" data-kind="${esc(e.kind)}">
  <span class="cr-ref">${esc(e.ref)}</span>
  <span class="cr-kind k-${esc(e.kind)}">${esc(e.kind)}</span>
  <span class="cr-etext" title="${esc(e.text)}">${esc(String(e.text || '').slice(0, 70))}</span>
</div>`).join('');
        elsBox.querySelectorAll('.cr-el').forEach(n => {
          n.onclick = () => {
            el('[data-cr="ref"]', root).value = n.dataset.ref;
            if (n.dataset.kind === 'input') el('[data-cr="act"]', root).value = 'type';
            else el('[data-cr="act"]', root).value = 'click';
            tabTo('agent');
          };
        });
      }

      /* ---------------- actions ---------------- */
      async function runAct() {
        const act = el('[data-cr="act"]', root).value;
        const body = { action: act };
        const url = el('[data-cr="url"]', root).value.trim() || omni.value.trim();
        const text = el('[data-cr="text"]', root).value;
        const ref = el('[data-cr="ref"]', root).value.trim();
        const selector = el('[data-cr="selector"]', root).value.trim();
        const key = el('[data-cr="key"]', root).value.trim();
        const xy = el('[data-cr="xy"]', root).value.trim();
        if (act === 'navigate') body.url = url;
        if (text) {
          if (act === 'click') body.text = text;
          else if (act === 'type') body.text = text;
          else body.value = text;
        }
        if (ref) body.ref = ref;
        if (selector) body.selector = selector;
        if (key) body.key = key;
        if (xy && /^\d+\s*,\s*\d+$/.test(xy)) { const [x, y] = xy.split(',').map(s => Number(s.trim())); body.x = x; body.y = y; }
        const option = (el('[data-cr="option"]', root).value || '').trim();
        if (option) { body.option = option; body.value = option; }
        if (act === 'waitFor') {
          if (selector) body.selector = selector;
          else if (text) body.text = text;
          else if (url) body.url = url;
          body.timeout = 20000;
        }
        if (act === 'eval') body.code = text || el('[data-cr="text"]', root).value;
        if (act === 'type' && !body.ref && !body.selector && !body.x) body.focus = false;

        if (!S.sessionId) {
          if (act === 'navigate') return newSession(body.url);
          const st = await refreshSessions();
          if (!S.sessionId) { show({ ok: false, error: 'pehle session banao (＋ button)' }); return; }
        }
        S.busy = true;
        setOverlay('agent chala raha hai…');
        const t0 = Date.now();
        const r = await jfetch('/api/browser/' + S.sessionId + '/act', {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
        });
        S.busy = false;
        setOverlay('');
        const d = r.data || {};
        log(act + ' (' + (Date.now() - t0) + 'ms) → ' + (d.ok === false ? 'FAIL ' + d.error : (d.url || 'ok')), d.ok === false ? 'error' : 'act');
        if (act === 'extract' && d.text) { textBox.textContent = d.text; tabTo('read'); }
        show(d);
        afterAction(d);
        return d;
      }

      async function readPage() {
        if (!S.sessionId) return show({ ok: false, error: 'session nahi hai' });
        setOverlay('page padh raha hai…');
        const r = await jfetch('/api/browser/' + S.sessionId + '/extract');
        setOverlay('');
        const d = r.data || {};
        S.text = d.text || '';
        textBox.textContent = d.text || '(khali)';
        log('extract → ' + (d.text || '').length + ' chars', 'read');
        tabTo('read');
        show({ ok: d.ok, title: d.title, url: d.url, chars: (d.text || '').length, headings: (d.headings || []).length, links: (d.links || []).length });
        return d;
      }

      async function screenshotToVfs() {
        if (!S.sessionId) return show({ ok: false, error: 'session nahi hai' });
        // screenshot binary aata hai -> base64 bana kar VFS me daalo
        try {
          const res = await fetch(apiUrl('/api/browser/' + S.sessionId + '/screenshot?type=png'));
          const blob = await res.blob();
          const b64 = await new Promise((resolve) => {
            const fr = new FileReader();
            fr.onload = () => resolve(String(fr.result).split(',')[1]);
            fr.readAsDataURL(blob);
          });
          const path = '/Home/Screenshots/chromium-' + Date.now() + '.png';
          const w = await jfetch('/api/fs/write', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ path, content: b64, binary: true, mime: 'image/png' })
          });
          S.screenshotPath = path;
          log('screenshot → ' + path, 'shot');
          show({ ok: true, path, bytes: blob.size, preview: apiUrl('/api/fs/raw?path=' + encodeURIComponent(path)) });
          WebOS.notify('Chromium', 'Screenshot saved: ' + path);
          return w.data;
        } catch (e) {
          show({ ok: false, error: e.message });
        }
      }

      async function runTask() {
        const ta = el('.cr-task', root);
        let actions;
        try { actions = JSON.parse(ta.value); } catch (e) { return (taskOut.textContent = 'JSON galat hai: ' + e.message); }
        if (!Array.isArray(actions)) actions = actions.actions || [];
        taskOut.textContent = 'chal raha hai… (' + actions.length + ' steps)';
        const r = await jfetch('/api/browser/task', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ actions, sessionId: S.sessionId || undefined, include: 'text' })
        });
        const d = r.data || {};
        taskOut.textContent = (d.results || []).map(x =>
          `#${x.step} ${x.action.padEnd(9)} ${x.ok ? '✓' : '✗'} ${x.ms}ms  ${x.url || ''}${x.error ? '  ! ' + x.error : ''}`
        ).join('\n') + `\n\nfinal: ${(d.final && d.final.url) || '-'}\n${d.ok ? '✅ task ok' : '❌ task failed'}`;
        if (d.sessionId) { S.sessionId = d.sessionId; await refreshSessions(d.sessionId); attachStream(d.sessionId); }
        const lastText = [...(d.results || [])].reverse().find(x => x.text);
        if (lastText) { textBox.textContent = lastText.text; }
        log('task ' + d.steps + '/' + d.total + (d.ok ? ' ok' : ' failed'), d.ok ? 'task' : 'error');
        if (d.final) setStatus(d.final.title, d.final.url);
        return d;
      }

      /* ---------------- toolbar wiring ---------------- */
      el('[data-cr="go"]', root).onclick = async () => {
        const u = omni.value.trim();
        if (!u) return;
        el('[data-cr="url"]', root).value = u;
        if (!S.sessionId) return newSession(u);
        el('[data-cr="act"]', root).value = 'navigate';
        return runAct();
      };
      omni.addEventListener('keydown', e => { if (e.key === 'Enter') el('[data-cr="go"]', root).click(); });
      el('[data-cr="back"]', root).onclick = () => { el('[data-cr="act"]', root).value = 'back'; runAct(); };
      el('[data-cr="forward"]', root).onclick = () => { el('[data-cr="act"]', root).value = 'forward'; runAct(); };
      el('[data-cr="reload"]', root).onclick = () => { el('[data-cr="act"]', root).value = 'reload'; runAct(); };
      el('[data-cr="new"]', root).onclick = () => newSession(omni.value.trim() || 'https://example.com');
      el('[data-cr="close"]', root).onclick = async () => {
        if (!S.sessionId) return;
        const r = await jfetch('/api/browser/' + S.sessionId + '/close', { method: 'POST', body: '{}' });
        log('session closed: ' + S.sessionId, 'close');
        if (S.stream) { try { S.stream.close(); } catch (e) {} S.stream = null; }
        if (S.polling) clearInterval(S.polling);
        S.sessionId = null;
        await refreshSessions();
        const st = await refreshSessions();
        if ((st.sessions || []).length) attachStream(st.sessions[0].id);
        else setOverlay('koi session nahi — ＋ dabao');
        show(r.data);
      };
      sessSel.onchange = () => { S.sessionId = sessSel.value || null; if (S.sessionId) attachStream(S.sessionId); };
      el('[data-cr="viewport"]', root).onchange = (e) => {
        const [w, h] = e.target.value.split('x').map(Number);
        WebOS.notify('Chromium', 'Naya viewport ' + w + '×' + h + ' — nayi session me lagega');
        S.viewport = { width: w, height: h };
      };

      /* live view me click / scroll -> seedha Chromium me */
      screen.addEventListener('click', async (e) => {
        if (!S.sessionId) return;
        const rect = screen.getBoundingClientRect();
        const x = Math.round((e.clientX - rect.left) * S.viewport.width / rect.width);
        const y = Math.round((e.clientY - rect.top) * S.viewport.height / rect.height);
        // visual feedback
        const ping = mk('div', 'cr-ping');
        ping.style.left = (e.clientX - rect.left) + 'px';
        ping.style.top = (e.clientY - rect.top) + 'px';
        el('.cr-screen-wrap', root).appendChild(ping);
        setTimeout(() => ping.remove(), 500);
        S.busy = true;
        const r = await jfetch('/api/browser/' + S.sessionId + '/click', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ x, y, elements: false })
        });
        S.busy = false;
        if (r.data && r.data.url) setStatus(r.data.title, r.data.url);
        log('click ' + x + ',' + y + ' → ' + ((r.data && r.data.url) || ''), 'human');
      });
      screen.addEventListener('wheel', async (e) => {
        if (!S.sessionId) return;
        e.preventDefault();
        if (S.busy) return;
        S.busy = true;
        await jfetch('/api/browser/' + S.sessionId + '/scroll', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ y: Math.round(e.deltaY * 1.5), elements: false })
        });
        S.busy = false;
      }, { passive: false });

      const keyIn = el('.cr-key', root);
      keyIn.addEventListener('keydown', async (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const text = keyIn.value;
          keyIn.value = '';
          if (!S.sessionId) return;
          await jfetch('/api/browser/' + S.sessionId + '/type', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ text, focus: false, clear: false, submit: true })
          });
          log('keyboard: "' + text + '" + Enter', 'human');
        }
      });
      root.querySelectorAll('[data-key]').forEach(b => {
        b.onclick = async () => {
          if (!S.sessionId) return;
          await jfetch('/api/browser/' + S.sessionId + '/press', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: b.dataset.key })
          });
          log('key press: ' + b.dataset.key, 'human');
        };
      });

      /* tabs + buttons */
      function tabTo(name) {
        root.querySelectorAll('.cr-tab').forEach(t => t.classList.toggle('on', t.dataset.tab === name));
        root.querySelectorAll('.cr-pane').forEach(p => p.classList.toggle('on', p.dataset.pane === name));
      }
      root.querySelectorAll('.cr-tab').forEach(t => t.onclick = () => tabTo(t.dataset.tab));
      el('[data-cr="run"]', root).onclick = runAct;
      el('[data-cr="read"]', root).onclick = readPage;
      el('[data-cr="read2"]', root).onclick = readPage;
      el('[data-cr="shot"]', root).onclick = screenshotToVfs;
      el('[data-cr="runtask"]', root).onclick = runTask;
      el('[data-cr="tmpl"]', root).onclick = () => {
        el('.cr-task', root).value = JSON.stringify([
          { action: 'navigate', url: 'https://duckduckgo.com' },
          { action: 'type', text_selector: 'Search', text: 'manus ai browser agent', submit: true },
          { action: 'extract', keep: true },
          { action: 'screenshot' }
        ], null, 2);
      };
      el('[data-cr="tmpl2"]', root).onclick = () => {
        // poora multi-step signup: select dropdowns, checkbox, radio, waitFor — sab use hota hai
        el('.cr-task', root).value = JSON.stringify([
          { action: 'navigate', url: 'https://automationexercise.com/signup' },
          { action: 'type', selector: 'input[data-qa="signup-name"]', text: 'WebOS Agent' },
          { action: 'type', selector: 'input[data-qa="signup-email"]', text: 'webos.agent.' + Date.now() + '@example.com' },
          { action: 'click', selector: 'button[data-qa="signup-button"]', elements: false },
          { action: 'waitFor', selector: 'input[data-qa="password"]' },
          { action: 'check', selector: '#id_gender1' },
          { action: 'type', selector: 'input[data-qa="password"]', text: 'Agent@12345' },
          { action: 'select', selector: '#days', value: '10' },
          { action: 'select', selector: '#months', value: '5' },
          { action: 'select', selector: '#years', value: '1995' },
          { action: 'check', selector: '#newsletter' },
          { action: 'type', selector: 'input[data-qa="first_name"]', text: 'Web' },
          { action: 'type', selector: 'input[data-qa="last_name"]', text: 'Agent' },
          { action: 'type', selector: 'input[data-qa="address"]', text: '42 Agent Street' },
          { action: 'select', selector: 'select[data-qa="country"]', value: 'India' },
          { action: 'type', selector: 'input[data-qa="state"]', text: 'UP' },
          { action: 'type', selector: 'input[data-qa="city"]', text: 'Varanasi' },
          { action: 'type', selector: 'input[data-qa="zipcode"]', text: '221001' },
          { action: 'type', selector: 'input[data-qa="mobile_number"]', text: '9876543210' },
          { action: 'click', selector: 'button[data-qa="create-account"]', elements: false },
          { action: 'waitFor', text: 'ACCOUNT CREATED', timeout: 25000 },
          { action: 'screenshot' }
        ], null, 2);
      };
      el('[data-cr="savetext"]', root).onclick = async () => {
        if (!S.text) return;
        const path = '/Home/chromium-read-' + Date.now() + '.txt';
        await jfetch('/api/fs/write', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ path, content: S.text })
        });
        WebOS.notify('Chromium', 'Text saved: ' + path);
        log('text → ' + path, 'save');
      };

      /* ---------------- boot ---------------- */
      (async () => {
        const st = await refreshSessions();
        setDot(st.running ? 'on' : 'idle', st.version || '');
        if (st.lastError && !st.running) {
          setOverlay('Chromium available nahi: ' + st.lastError.slice(0, 160));
        }
        const first = (st.sessions || [])[0];
        if (first) {
          S.sessionId = first.id;
          sessSel.value = first.id;
          attachStream(first.id);
          setOverlay('');
          setStatus(first.title, first.url);
        } else {
          setOverlay('Chromium start ho raha hai…');
          await newSession('https://example.com');
        }
        log('Chromium app ready · ' + (st.running ? 'engine running' : 'engine idle (pehli session pe launch hoga)'), 'boot');
      })().catch(e => log('boot error: ' + e.message, 'error'));

      /* window band hone par stream/polling saaf karo (warna background me frames aate rahenge) */
      let cleaned = false;
      function cleanup() {
        if (cleaned) return;
        cleaned = true;
        if (S.stream) { try { S.stream.close(); } catch (e) {} S.stream = null; }
        if (S.polling) { clearInterval(S.polling); S.polling = null; }
      }
      try { a.on('window:close', w => { if (w && w.id === a.win.id) cleanup(); }); } catch (e) {}
      try {
        const mo = new MutationObserver(() => { if (!document.contains(a.win.el)) { cleanup(); mo.disconnect(); } });
        mo.observe(document.getElementById('windows') || document.body, { childList: true });
      } catch (e) {}

      /* ================= OS agent ke liye ops =================
         WebOS.handleCommand({op:'chrome.act', args:{...}}) */
      async function handleCommand(cmd) {
        const args = cmd.args || {};
        const op = String(cmd.op || '').toLowerCase();
        const ensure = async () => {
          if (S.sessionId) return S.sessionId;
          if (args.url) return await newSession(args.url);
          const st = await refreshSessions();
          const first = (st.sessions || [])[0];
          if (first) { S.sessionId = first.id; attachStream(first.id); return first.id; }
          return await newSession('about:blank');
        };
        switch (op) {
          case 'chrome.status': case 'chromium.status': {
            const st = await refreshSessions();
            return { ok: true, running: st.running, version: st.version, sessions: st.sessions, appSession: S.sessionId };
          }
          case 'chrome.open': case 'chromium.open':
            return { ok: true, sessionId: await ensure(), url: args.url, viewport: S.viewport };
          case 'chrome.goto': case 'chromium.goto': case 'chrome.navigate': case 'chromium.navigate': {
            S.sessionId = await ensure();
            el('[data-cr="act"]', root).value = 'navigate';
            el('[data-cr="url"]', root).value = args.url || '';
            const d = await runAct();
            return { ok: d && d.ok !== false, url: (d && d.url) || args.url, title: d && d.title, elements: d && d.elementCount };
          }

  function looksLikeUrl(s) {
    s = String(s || '').trim();
    if (!s) return false;
    if (/^(https?:\/\/|webos:\/\/)/i.test(s)) return true;
    if (/^localhost(:\d+)?(\/|$)/i.test(s)) return true;
    if (/^[\w-]+(\.[\w-]+)+(\/|:|$)/.test(s) && !/\s/.test(s)) return true;

  }
  function normalizeUrl(s) {
    s = String(s || '').trim();

  function vis(e){ if(!e) return false; var s=getComputedStyle(e); if(s.display==='none'||s.visibility==='hidden') return false; var r=e.getBoundingClientRect(); return !(r.width<1&&r.height<1); }

    }catch(e){ res.error=String(e&&e.message||e); }
    if(d.replyId) send({type:'cmdResult', replyId:d.replyId, result:res});

})();<\/script>`;
  }

  function startPage() {

      ['example.com', 'https://example.com', '🌐'],

<style>
 body{margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:radial-gradient(900px 600px at 20% 10%,#1b2a5e,#0b0e16 60%);color:#e9edf7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}

 document.getElementById('f').addEventListener('submit', function(e){

  function searchPage(query, results, engine) {
    const rows = (results || []).map(r => `
      <a class="r" href="${esc(r.url)}">

<style>
 body{margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:#0e1119;color:#e9edf7}
 header{position:sticky;top:0;background:rgba(14,17,25,.95);border-bottom:1px solid rgba(255,255,255,.08);padding:12px 16px;display:flex;gap:10px;align-items:center}

 .r:hover{background:rgba(107,140,255,.16);border-color:rgba(107,140,255,.4)}

<script>
 function go(){ var v=document.getElementById('q').value.trim(); if(!v) return; parent.postMessage({__webos:true,type:'navigate',url:'webos://search?q='+encodeURIComponent(v)},'*'); }

  /* ================= app ================= */
  WebOS.registerApp({
    id: 'browser',
    name: 'Browser',
    icon: '🌐',
    width: 1120,
    height: 720,

    mount(a) {
      const root = a.win.body;
      let tabs = [];
      let tabSeq = 0;
      let activeId = null;
      let panelMode = null; // 'elements' | 'text' | 'tools'

      /* ---- DOM ---- */
      const tabbar = mk('div', 'tabs');
      const toolbar = mk('div', 'toolbar');
      toolbar.innerHTML = `
        <button class="tb-btn" data-act="back" title="Back (Alt+←)">‹</button>
        <button class="tb-btn" data-act="fwd" title="Forward">›</button>
        <button class="tb-btn" data-act="reload" title="Reload (F5)">⟳</button>
        <button class="tb-btn" data-act="home" title="Home">⌂</button>
        <input class="inp" id="omni" placeholder="URL ya search… (Ctrl+K)" autocomplete="off" spellcheck="false">
        <button class="tb-btn primary" data-act="go">Go</button>
        <button class="tb-btn" data-act="panel" title="Toggle side panel">☰</button>
        <button class="tb-btn" data-act="chromium" title="Asli Chromium me kholo (X-Frame-Options wali sites bhi chalti hain)">🌐</button>`;
      const frameBox = mk('div', 'br-frame');
      const progress = mk('div', 'br-progress');
      frameBox.appendChild(progress);
      const panel = mk('div', 'br-side hide');

      const split = mk('div', 'split');
      split.appendChild(frameBox);
      split.appendChild(panel);

      const status = mk('div', 'statusbar');
      status.innerHTML = `<span id="stUrl">webos://start</span><span id="stInfo"></span>`;

      root.appendChild(tabbar);
      root.appendChild(toolbar);
      root.appendChild(split);
      root.appendChild(status);

      const omni = toolbar.querySelector('#omni');
      const stUrl = status.querySelector('#stUrl');
      const stInfo = status.querySelector('#stInfo');

      /* ---- tabs ---- */
      function activeTab() { return tabs.find(t => t.id === activeId) || null; }

      function createTab(url, opts = {}) {
        const id = 't' + (++tabSeq);
        const wrap = mk('div', 'br-tabview');
        const iframe = document.createElement('iframe');
        iframe.setAttribute('sandbox', SANDBOX);
        iframe.setAttribute('referrerpolicy', 'no-referrer');
        iframe.name = 'webframe_' + id;
        iframe.dataset.tab = id;
        const loadingEl = mk('div', 'br-loading', '<span class="spin"></span><span>booting…</span>');
        loadingEl.style.display = 'none';
        wrap.appendChild(iframe);
        wrap.appendChild(loadingEl);
        wrap.style.display = 'none';
        frameBox.appendChild(wrap);
        const tab = {
          id, iframe, wrap, loadingEl, url: url || 'webos://start', title: 'New Tab', history: [], hi: -1,
          loading: false, elements: [], text: '', pageTitle: '', lastSnapshot: 0, loadStart: 0, loadWaiters: []
        };
        tabs.push(tab);
        iframe.addEventListener('load', () => onFrameLoad(tab));
        setActive(tab.id);
        navigate(tab, tab.url, { replace: true, skipHistory: false });
        renderTabs();
        return tab;
      }

      function closeTab(id) {
        const i = tabs.findIndex(t => t.id === id);
        if (i < 0) return;
        const [t] = tabs.splice(i, 1);
        try { t.wrap.remove(); } catch (e) {}
        if (activeId === id) {
          const next = tabs[i] || tabs[i - 1] || null;
          if (next) setActive(next.id); else createTab('webos://start');
        }
        renderTabs(); publish();
      }

      function setActive(id) {
        activeId = id;
        tabs.forEach(t => { t.wrap.style.display = t.id === id ? 'block' : 'none'; });
        renderTabs(); syncToolbar(); publish();
      }

      function renderTabs() {
        tabbar.innerHTML = '';
        tabs.forEach(t => {
          const d = mk('div', 'tab' + (t.id === activeId ? ' active' : ''));
          d.dataset.tab = t.id;
          d.innerHTML = `<span class="t">${esc(t.loading ? '… ' : '')}${esc(t.title || 'New Tab')}</span><span class="x" data-close="${t.id}">✕</span>`;
          d.onclick = (e) => {
            if (e.target.dataset.close) { closeTab(e.target.dataset.close); return; }
            setActive(t.id);
          };
          tabbar.appendChild(d);
        });
        const plus = mk('div', 'tab', '<span class="t">＋</span>');
        plus.style.maxWidth = '46px';
        plus.title = 'New tab (Ctrl+T)';
        plus.onclick = () => createTab('webos://start');
        tabbar.appendChild(plus);
      }

      function syncToolbar() {
        const t = activeTab();
        if (!t) return;
        if (document.activeElement !== omni) omni.value = t.url === 'webos://start' ? '' : t.url;
        toolbar.querySelector('[data-act="back"]').disabled = t.hi <= 0;
        toolbar.querySelector('[data-act="fwd"]').disabled = t.hi >= t.history.length - 1;
        stUrl.textContent = t.url;
        stInfo.textContent = localMode()
          ? 'local mode • direct load • agent refs ke liye server chalao'
          : `${t.elements.length} elements • ${t.text.length} chars • ${t.loading ? 'loading' : 'ready'}`;
      }

      /* ---- navigation ---- */
      async function navigate(tab, url, opts = {}) {
        if (!tab) return false;
        url = String(url || '').trim();
        if (!url) return false;

        if (/^webos:\/\/search\?q=/i.test(url)) {
          const q = decodeURIComponent(url.split('q=')[1] || '');
          return doSearch(tab, q, opts);
        }

        // internal start page
        if (/^webos:\/\/(start|home|newtab)$/i.test(url) || url === '') {
          tab.url = 'webos://start';
          tab.title = 'New Tab';
          tab.loading = true;
          progress.classList.add('on');
          tab.elements = []; tab.text = ''; tab.pageTitle = '';
          tab.loadStart = Date.now();
          tab.pendingTarget = null;
          tab.navSettled = true;
          if (!opts.skipHistory) {
            tab.history = tab.history.slice(0, tab.hi + 1);
            tab.history.push(tab.url);
            tab.hi = tab.history.length - 1;
          }
          tab.loadingEl.innerHTML = '<span class="spin"></span><span>new tab</span>';
          tab.loadingEl.style.display = 'flex';
          tab.iframe.removeAttribute('src');
          tab.iframe.srcdoc = startPage();
          renderTabs(); syncToolbar(); publish();
          const ok0 = await waitForLoad(tab, opts.timeout || 8000);
          return ok0;
        }

        const real = normalizeUrl(url);
        tab.url = real;
        tab.title = hostOf(real);
        tab.loading = true;
        tab.elements = [];
        tab.text = '';
        tab.pageTitle = '';
        tab.loadStart = Date.now();
        tab.pendingTarget = real;
        tab.navSettled = false;
        progress.classList.add('on');

        if (!opts.skipHistory) {
          tab.history = tab.history.slice(0, tab.hi + 1);
          if (tab.history[tab.history.length - 1] !== real) tab.history.push(real);
          tab.hi = tab.history.length - 1;
        } else if (tab.hi < 0) {
          tab.history = [real]; tab.hi = 0;
        }

        tab.loadingEl.innerHTML = '<span class="spin"></span><span>loading ' + esc(hostOf(real)) + '…</span>';
        tab.loadingEl.style.display = 'flex';

        tab.iframe.removeAttribute('srcdoc');
        tab.iframe.src = proxyUrl(real);
        renderTabs(); syncToolbar(); publish();

        const ok = await waitForLoad(tab, opts.timeout || (localMode() ? 8000 : 20000));
        publish();
        return ok;
      }

      async function doSearch(tab, query, opts = {}) {
        if (localMode()) {
          // no server -> no /api/search. Just hand the query to the engine itself.
          return navigate(tab, 'https://duckduckgo.com/?q=' + encodeURIComponent(query), { skipHistory: opts.skipHistory });
        }
        tab.loading = true; progress.classList.add('on');
        tab.url = 'webos://search?q=' + encodeURIComponent(query);
        tab.title = '🔍 ' + query;
        if (!opts.skipHistory) {
          tab.history = tab.history.slice(0, tab.hi + 1);
          tab.history.push(tab.url);
          tab.hi = tab.history.length - 1;
        }
        tab.loadingEl.innerHTML = '<span class="spin"></span><span>searching…</span>';
        tab.loadingEl.style.display = 'flex';
        let results = [], engine = null;
        try {
          const r = await WebOS.api.search(query);
          results = r.results || [];
          engine = r.engine;
        } catch (e) {}
        tab.iframe.removeAttribute('src');
        tab.iframe.srcdoc = searchPage(query, results, engine);
        tab.pendingTarget = null;
        tab.searchResults = results;
        tab.lastUrl = tab.url;
        setTimeout(() => { tab.loading = false; progress.classList.remove('on'); tab.loadingEl.style.display = 'none'; renderTabs(); syncToolbar(); publish(); }, 400);
        renderTabs(); syncToolbar(); publish();
        return { ok: true, url: tab.url, results: results.length, engine };
      }

      function waitForLoad(tab, timeout) {
        return new Promise((resolve) => {
          let done = false;
          const finish = (v) => {
            if (done) return;
            done = true;
            tab.loading = false;
            progress.classList.remove('on');
            tab.loadingEl.style.display = 'none';
            renderTabs(); syncToolbar(); publish();
            resolve(v);
          };
          tab.loadWaiters.push(finish);
          setTimeout(() => finish(true), timeout || 20000);
        });
      }

      function onFrameLoad(tab) {
        // wait until the page's own bridge reports a fresh snapshot (or give up after ~2.6s)
        let waited = 0;
        const check = () => {
          const fresh = tab.navSettled === true;
          if (fresh || waited >= 3200) {
            const waiters = tab.loadWaiters.splice(0);
            tab.loading = false;
            progress.classList.remove('on');
            tab.loadingEl.style.display = 'none';
            waiters.forEach(w => w(true));
            renderTabs(); syncToolbar(); publish();
            return;
          }
          waited += 200;
          setTimeout(check, 200);
        };
        setTimeout(check, 220);
      }

      function goBack(tab) {
        tab = tab || activeTab();
        if (!tab || tab.hi <= 0) return false;
        tab.hi--; navigate(tab, tab.history[tab.hi], { skipHistory: true });
        return true;
      }
      function goForward(tab) {
        tab = tab || activeTab();
        if (!tab || tab.hi >= tab.history.length - 1) return false;
        tab.hi++; navigate(tab, tab.history[tab.hi], { skipHistory: true });
        return true;
      }

      /* ---- message bus from pages ---- */
      window.addEventListener('message', (ev) => {
        const d = ev.data || {};
        if (!d.__webos) return;
        const tab = tabs.find(t => t.iframe.contentWindow === ev.source);
        if (!tab) return;
        if (d.type === 'page') {
          tab.pageTitle = d.title || tab.pageTitle;
          tab.text = d.text || '';
          tab.elements = d.elements || [];
          const ru = realUrl(d.url);
          if (ru && !/^webos:/.test(ru) && !/^about:/.test(ru)) {
            tab.url = ru;
            if (!tab.history.length || tab.history[tab.hi] !== ru) { tab.history = tab.history.slice(0, tab.hi + 1); tab.history.push(ru); tab.hi = tab.history.length - 1; }
          }
          tab.title = d.title ? d.title.slice(0, 60) : tab.title;
          tab.lastSnapshot = Date.now();
          if (tab.pendingTarget) {
            try {
              const a = new URL(ru || tab.url), b = new URL(tab.pendingTarget);
              if (a.host && a.host === b.host) { tab.navSettled = true; tab.pendingTarget = null; }
            } catch (e) {
              tab.navSettled = true; tab.pendingTarget = null;
            }
          }
          if (tab.id === activeId) { syncToolbar(); renderPanel(); }
          renderTabs(); publish();
          return;
        }
        if (d.type === 'navigate') {
          if (d.newTab) createTab(d.url); else navigate(activeTab() === tab ? tab : tab, d.url);
          return;
        }
        if (d.type === 'form') {
          if (d.method === 'POST') {
            const f = document.createElement('form');
            f.method = 'POST';
            f.action = '/api/proxy?url=' + encodeURIComponent(d.url);
            f.target = tab.iframe.name;
            f.style.display = 'none';
            new URLSearchParams(d.data).forEach((v, k) => {
              const i = document.createElement('input'); i.name = k; i.value = v; f.appendChild(i);
            });
            document.body.appendChild(f);
            f.submit();
            setTimeout(() => f.remove(), 1500);
          } else {
            navigate(tab, d.url);
          }
          return;
        }
        if (d.type === 'cmdResult') {
          const p = pendingReplies.get(d.replyId);
          if (p) { clearTimeout(p.timer); pendingReplies.delete(d.replyId); p.resolve(d.result || { ok: false }); }
          return;
        }
      });

      /* ---- page commands (agent) ---- */
      const pendingReplies = new Map();
      let replySeq = 0;
      function pageCmd(tab, op, payload, timeout = 6000) {
        tab = tab || activeTab();
        if (!tab) return Promise.resolve({ ok: false, error: 'no tab' });
        const replyId = 'r' + (++replySeq);
        return new Promise((resolve) => {
          const timer = setTimeout(() => { pendingReplies.delete(replyId); resolve({ ok: false, error: 'page did not respond (cross-origin page?)' }); }, timeout);
          pendingReplies.set(replyId, { resolve, timer });
          try {
            tab.iframe.contentWindow.postMessage({ __webosCmd: true, op, replyId, ...payload }, '*');
          } catch (e) {
            clearTimeout(timer); pendingReplies.delete(replyId);
            resolve({ ok: false, error: e.message });
          }
        });
      }

      /* ---- side panel ---- */
      function togglePanel(mode) {
        panelMode = mode === undefined ? (panelMode ? null : 'elements') : (panelMode === mode ? null : mode);
        panel.classList.toggle('hide', !panelMode);
        renderPanel();
        publish();
      }

      function renderPanel() {
        if (!panelMode) return;
        const t = activeTab();
        panel.innerHTML = '';
        const pt = mk('div', 'panel-tabs');
        [['elements', 'Elements'], ['text', 'Text'], ['tools', 'Tools']].forEach(([m, label]) => {
          const b = mk('button', panelMode === m ? 'active' : '', label);
          b.onclick = () => { panelMode = m; renderPanel(); };
          pt.appendChild(b);
        });
        panel.appendChild(pt);
        const body = mk('div', 'panel-body');

        if (!t) {
          body.innerHTML = '<div class="empty">no tab</div>';
          panel.appendChild(body);
          return;
        }

        if (panelMode === 'elements') {
          if (!t.elements.length) {
            body.innerHTML = `<div class="empty"><span class="big">🖱️</span>Is page se elements nahi mile.<br>Page load hone ke baad refresh karo, ya koi normal website kholo.</div>`;
          } else {
            const info = mk('div', '', `<div style="color:var(--muted);font-size:11px;margin-bottom:8px">${t.elements.length} interactive elements — agent <code>click {ref}</code> / <code>type {ref,text}</code> use karta hai</div>`);
            body.appendChild(info);
            t.elements.forEach(e => {
              const row = mk('div', 'el');
              row.dataset.ref = e.ref;
              row.innerHTML = `<div><span class="k">#${e.ref} ${esc(e.kind)}</span>${esc((e.text || '').slice(0, 90))}</div>${e.href ? `<div class="u">${esc(e.href.slice(0, 90))}</div>` : ''}`;
              row.onclick = () => { pageCmd(t, 'select', { ref: e.ref }); };
              row.ondblclick = () => { pageCmd(t, 'click', { ref: e.ref }); };
              body.appendChild(row);
            });
          }
        } else if (panelMode === 'text') {
          const pre = mk('div', 'reader-text', esc(t.text || '(no text captured yet)'));
          body.appendChild(pre);
        } else {
          body.innerHTML = `
            <div class="kv">
              <b>URL</b><span class="mono" style="word-break:break-all">${esc(t.url)}</span>
              <b>Title</b><span>${esc(t.title)}</span>
              <b>Elements</b><span>${t.elements.length}</span>
              <b>Text chars</b><span>${t.text.length}</span>
              <b>Last snapshot</b><span>${t.lastSnapshot ? new Date(t.lastSnapshot).toLocaleTimeString() : '—'}</span>
              <b>History</b><span>${t.hi + 1}/${t.history.length}</span>
            </div>
            <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
              <button class="tb-btn" data-t="snap">🔄 snapshot</button>
              <button class="tb-btn" data-t="scroll">↓ scroll</button>
              <button class="tb-btn" data-t="reader">📖 server text</button>
            </div>
            <div id="toolsOut" class="mono" style="margin-top:10px;font-size:11px;color:var(--muted);white-space:pre-wrap"></div>`;
          body.querySelectorAll('[data-t]').forEach(b => {
            b.onclick = async () => {
              const out = body.querySelector('#toolsOut');
              const act = b.dataset.t;
              if (act === 'snap') { await pageCmd(t, 'snapshot', {}); out.textContent = 'snapshot requested'; }
              if (act === 'scroll') { const r = await pageCmd(t, 'scroll', { y: 700 }); out.textContent = JSON.stringify(r); }
              if (act === 'reader') {
                out.textContent = 'fetching…';
                try {
                  const r = await WebOS.api.readUrl(t.url);
                  t.text = r.text || t.text; t.title = r.title || t.title;
                  panelMode = 'text'; renderPanel(); publish();
                } catch (e) { out.textContent = 'failed: ' + e.message; }
              }
            };
          });
        }
        panel.appendChild(body);
      }

      /* ---- toolbar wiring ---- */
      toolbar.addEventListener('click', (e) => {
        const act = e.target.dataset && e.target.dataset.act;
        if (!act) return;
        const t = activeTab();
        if (act === 'back') goBack(t);
        if (act === 'fwd') goForward(t);
        if (act === 'reload') navigate(t, t.url, { skipHistory: true });
        if (act === 'home') navigate(t, 'webos://start', { skipHistory: false });
        if (act === 'go') submitOmni();
        if (act === 'panel') togglePanel();
        if (act === 'chromium') {
          // asli headless Chromium app (server mode) — isi URL ke saath kholo
          const u = t && t.url && !/^webos:/.test(t.url) ? t.url : '';
          try {
            WebOS.open('chromium');
            if (WebOS.isLocal) {
              WebOS.notify('Chromium', 'Single-file build me pehle remote server URL daalo (🌐 window me)');
            } else if (u) {
              // asli Chromium me wahi URL kholo (bus op; GUI ke bina bhi chalta hai)
              setTimeout(() => {
                WebOS.handleCommand({ op: 'chrome.goto', app: 'chromium', args: { url: u } })
                  .catch(() => {});
              }, 400);
              WebOS.notify('Chromium', 'Asli Chromium me khul raha hai: ' + u.slice(0, 60));
            }
          } catch (e) {}
        }
      });
      function submitOmni() {
        const v = omni.value.trim();
        if (!v) return;
        const url = looksLikeUrl(v) ? normalizeUrl(v) : ('webos://search?q=' + encodeURIComponent(v));
        navigate(activeTab(), url);
      }
      omni.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitOmni(); });
      omni.addEventListener('focus', () => omni.select());

      root.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key.toLowerCase() === 'k') { e.preventDefault(); omni.focus(); }
        if (e.ctrlKey && e.key.toLowerCase() === 't') { e.preventDefault(); createTab('webos://start'); }
        if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
        if (e.key === 'F5') { e.preventDefault(); const t = activeTab(); navigate(t, t.url, { skipHistory: true }); }
      });

      /* ---- state for the agent ---- */
      function publish() {
        const t = activeTab();
        a.publishState({
          searchResults: t && t.searchResults ? t.searchResults.slice(0, 10) : [],
          url: t ? t.url : null,
          title: t ? t.title : null,
          loading: t ? t.loading : false,
          tabs: tabs.map(x => ({ id: x.id, url: x.url, title: x.title, active: x.id === activeId })),
          elements: t ? t.elements.slice(0, 60) : [],
          elementCount: t ? t.elements.length : 0,
          textPreview: t ? (t.text || '').slice(0, 4000) : '',
          panel: panelMode
        });
      }

      /* ---- agent command handler ---- */
      async function handleCommand(cmd) {
        const args = cmd.args || {};
        const op = String(cmd.op || '').toLowerCase();
        const t = activeTab();

        switch (op) {
          case 'navigate': case 'goto': case 'open-url':
          case 'browse': {
            const url = args.url || args.href || cmd.url;
            if (!url) return { ok: false, error: 'args.url required' };
            if (args.newTab || args.newWindow) { const nt = createTab(url); return { ok: true, tab: nt.id, url }; }
            const target = tabs.find(x => x.id === args.tab) || t;
            const res = await navigate(target, url, { timeout: args.timeout || 20000 });
            return {
              ok: res !== false, url: target.url, title: target.title,
              elements: target.elements.length, textPreview: (target.text || '').slice(0, 1500)
            };
          }
          case 'search': {
            const q = args.q || args.query || args.text;
            if (!q) return { ok: false, error: 'args.q required' };
            const r = await doSearch(t, q);
            return {
              ok: true, url: t.url, count: r.results, engine: r.engine, query: q,
              results: (t.searchResults || []).slice(0, Number(args.limit) || 15).map(x => ({ title: x.title, url: x.url, snippet: (x.snippet || '').slice(0, 200) }))
            };
          }
          case 'back': return { ok: goBack(t), url: t ? t.url : null };
          case 'forward': case 'fwd': return { ok: goForward(t), url: t ? t.url : null };
          case 'reload': case 'refresh': await navigate(t, t.url, { skipHistory: true }); return { ok: true, url: t.url };
          case 'home': await navigate(t, 'webos://start'); return { ok: true, url: 'webos://start' };
          case 'read': case 'snapshot': {
            if (localMode() && t && t.elements.length === 0) {
              return {
                ok: false, localMode: true, url: t.url,
                error: 'local (single-file) build me page ke andar inject nahi ho sakta — ' +
                       'elements/text ke liye server mode chalao: node server.js'
              };
            }
            const mode = args.mode || 'auto';
            let text = t ? t.text : '';
            let title = t ? t.title : '';
            let url = t ? t.url : '';
            let elements = t ? t.elements : [];
            if ((mode === 'server' || !text || text.length < 60) && url && !/^webos:/.test(url)) {
              try {
                const r = await WebOS.api.readUrl(url);
                if (r && !r.error) { text = r.text || text; title = r.title || title; }
              } catch (e) {}
            }
            if (mode === 'elements') return { ok: true, url, title, elements: elements.slice(0, Number(args.limit) || 100) };
            if (mode === 'text') return { ok: true, url, title, text: (text || '').slice(0, Number(args.limit) || 20000) };
            return {
              ok: true, url, title,
              text: (text || '').slice(0, Number(args.limit) || 12000),
              elements: elements.slice(0, Number(args.limit) || 100)
            };
          }
          case 'links': {
            return { ok: true, links: (t ? t.elements : []).filter(e => e.kind === 'link').map(e => ({ ref: e.ref, text: e.text, href: e.href })) };
          }
          case 'inputs': {
            return {
              ok: true,
              inputs: (t ? t.elements : []).filter(e => e.kind === 'input').map(e => ({ ref: e.ref, tag: e.tag, name: e.name, type: e.type, text: e.text })),
              buttons: (t ? t.elements : []).filter(e => e.kind !== 'input').slice(0, 25).map(e => ({ ref: e.ref, text: e.text, href: e.href }))
            };
          }
          case 'click': {
            if (!t) return { ok: false, error: 'no tab' };
            let ref = args.ref;
            if (!ref && (args.text || args.selector)) {
              const needle = String(args.text || args.selector).toLowerCase().trim();
              const pool = t.elements.filter(e => e.kind !== 'input');
              const exact = pool.find(e => (e.text || '').toLowerCase().trim() === needle);
              const starts = pool.find(e => (e.text || '').toLowerCase().trim().startsWith(needle));
              const has = pool.find(e => (e.text || '').toLowerCase().includes(needle));
              const inp = t.elements.find(e => e.kind === 'input' && (e.text || '').toLowerCase().includes(needle));
              const picked = exact || starts || has || inp;
              ref = picked && picked.ref;
              if (!ref) return { ok: false, error: 'no element matching: ' + needle, elements: t.elements.slice(0, 40) };
              if (!args.expect && picked.href) { /* let it navigate normally */ }
            }
            if (!ref) return { ok: false, error: 'args.ref or args.text required' };
            const r = await pageCmd(t, 'click', { ref: Number(ref) });
            if (args.wait !== false) await new Promise(res => setTimeout(res, args.settle || 900));
            return { ok: r.ok !== false, clicked: Number(ref), url: t.url, title: t.title, error: r.error, elements: t.elements.length };
          }
          case 'type': case 'fill': {
            if (!t) return { ok: false, error: 'no tab' };
            let ref = args.ref;
            if (!ref && args.selector) {
              const f = t.elements.find(e => e.kind === 'input' && (e.text || '').toLowerCase().includes(String(args.selector).toLowerCase()));
              ref = f && f.ref;
            }
            const BAD_TYPES = ['submit', 'button', 'reset', 'image', 'checkbox', 'radio', 'file', 'hidden'];
            const textInputs = () => t.elements.filter(e =>
              e.kind === 'input' && !BAD_TYPES.includes(String(e.type || '').toLowerCase()) && e.tag !== 'select' && e.tag !== 'button');
            if (!ref && args.field != null && textInputs().length) {
              const list = textInputs();
              const idx = Number(args.field) || 0;
              ref = list[idx] && list[idx].ref;
            }
            if (!ref && (args.field != null)) {
              const list = textInputs();
              if (!ref) return { ok: false, error: 'no text input at field ' + args.field, inputs: list.map(e => ({ ref: e.ref, name: e.name, type: e.type })) };
            }
            if (!ref) return { ok: false, error: 'args.ref / args.field required', inputs: t.elements.filter(e => e.kind === 'input') };
            const text = String(args.text != null ? args.text : args.value != null ? args.value : '');
            const r = await pageCmd(t, 'type', { ref: Number(ref), text, submit: !!args.submit });
            if (args.submit || args.wait) await new Promise(res => setTimeout(res, args.settle || 1600));
            publish();
            return { ok: r.ok !== false, ref: Number(ref), typed: text, url: t.url, error: r.error };
          }
          case 'press': case 'key': {
            if (!t) return { ok: false, error: 'no tab' };
            const r = await pageCmd(t, 'key', { key: args.key || 'Enter' });
            return { ok: r.ok !== false, error: r.error };
          }
          case 'scroll': {
            if (!t) return { ok: false, error: 'no tab' };
            const r = await pageCmd(t, args.y === 'bottom' ? 'scrollTo' : 'scroll', { y: args.y === 'bottom' ? 999999 : Number(args.y) || 700 });
            return { ok: r.ok !== false, error: r.error };
          }
          case 'eval': {
            if (!t) return { ok: false, error: 'no tab' };
            if (!args.code) return { ok: false, error: 'args.code required' };
            const r = await pageCmd(t, 'eval', { code: args.code });
            return { ok: r.ok !== false, value: r.value, error: r.error };
          }
          case 'tabs': return { ok: true, tabs: tabs.map(x => ({ id: x.id, url: x.url, title: x.title, active: x.id === activeId })) };
          case 'newtab': { const nt = createTab(args.url || 'webos://start'); return { ok: true, tab: nt.id }; }
          case 'closetab': {
            if (args.id) { closeTab(args.id); return { ok: true }; }
            if (t) { closeTab(t.id); return { ok: true }; }
            return { ok: false, error: 'no tab' };
          }
          case 'switchtab': {
            const target = tabs.find(x => x.id === args.id) || tabs[Number(args.index) || 0];
            if (!target) return { ok: false, error: 'tab not found', tabs: tabs.map(x => x.id) };
            setActive(target.id);
            return { ok: true, tab: target.id, url: target.url };
          }
          case 'panel': {
            if (args.mode === 'off') { panelMode = null; panel.classList.add('hide'); }
            else togglePanel(args.mode || 'elements');
            return { ok: true, panel: panelMode };
          }
          case 'extract': {
            // server-side text extraction of any url, works without executing the page
            const url = args.url || (t && t.url);
            if (!url) return { ok: false, error: 'no url' };
            try {
              const r = await WebOS.api.readUrl(url);
              return { ok: true, url: r.url || url, title: r.title, text: (r.text || '').slice(0, Number(args.limit) || 12000), linkCount: (r.links || []).length, links: (r.links || []).slice(0, 60) };
            } catch (e) { return { ok: false, error: e.message }; }
          }
          default:
            return null; // not a browser op -> let other handlers try
        }
      }

      /* ---- init ---- */
      const startUrl = (a.args && (a.args.url || a.args.arg)) || 'webos://start';
      createTab(startUrl);
      a.setTitle('Browser', hostOf(startUrl));
      const origPublish = publish;
      publish = function () { origPublish(); const t = activeTab(); a.setSubtitle(t ? hostOf(t.url) : ''); };

      return {
        handleCommand,
        onArgs(nargs) { if (nargs && nargs.url) navigate(activeTab(), nargs.url); else if (nargs && nargs.arg) navigate(activeTab(), nargs.arg); },
        state() {
          const t = activeTab();
          return {
            url: t ? t.url : null, title: t ? t.title : null, loading: t ? t.loading : false,
            tabs: tabs.map(x => ({ id: x.id, url: x.url, title: x.title, active: x.id === activeId })),
            elements: t ? t.elements.slice(0, 80) : [],
            elementCount: t ? t.elements.length : 0,
            textPreview: t ? (t.text || '').slice(0, 4000) : '',
            panel: panelMode
          };
        },
        destroy() {
          tabs.forEach(t => { try { t.wrap.remove(); } catch (e) {} });
          tabs = [];
        }
      };
    }
  });
})();

</script>
<script>
/* ============ Files — virtual filesystem browser ============ */
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function mk(t, c, h) { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; }
  const icon = (e) => e.type === 'dir' ? '📁' : /\.(md|txt|log|json|js|css|html)$/i.test(e.name) ? '📄' : '📃';
  const fmt = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

  WebOS.registerApp({
    id: 'files', name: 'Files', icon: '📁', width: 900, height: 560,
    mount(a) {
      let cwd = (a.args && (a.args.path || a.args.arg)) || '/Home';
      let sel = null;

      const root = a.win.body;
      const toolbar = mk('div', 'toolbar');
      toolbar.innerHTML = `
        <button class="tb-btn" data-a="up" title="Up">⬆</button>
        <button class="tb-btn" data-a="refresh" title="Refresh">⟳</button>
        <input class="inp mono" id="pathin" spellcheck="false">
        <button class="tb-btn" data-a="newdir">＋ Folder</button>
        <button class="tb-btn" data-a="newfile">＋ File</button>
        <button class="tb-btn" data-a="rename" disabled>✏️</button>
        <button class="tb-btn" data-a="delete" disabled>🗑</button>
        <button class="tb-btn" data-a="download" disabled>⤓</button>`;
      const split = mk('div', 'split');
      const side = mk('div', 'side');
      const list = mk('div', 'list');
      split.appendChild(side); split.appendChild(list);
      const status = mk('div', 'statusbar');
      root.appendChild(toolbar); root.appendChild(split); root.appendChild(status);

      const pathin = toolbar.querySelector('#pathin');
      pathin.addEventListener('keydown', (e) => { if (e.key === 'Enter') { cwd = pathin.value.trim() || cwd; refresh(); } });

      toolbar.addEventListener('click', async (e) => {
        const act = e.target.dataset && e.target.dataset.a;
        if (!act) return;
        if (act === 'up') { cwd = cwd.replace(/\/[^/]+\/?$/, '') || '/'; refresh(); }
        if (act === 'refresh') refresh();
        if (act === 'newdir') {
          const name = await WebOS.prompt('New folder name', '', 'e.g. Projects');
          if (name) { await WebOS.api.fs.mkdir(cwd.replace(/\/$/, '') + '/' + name); refresh(); }
        }
        if (act === 'newfile') {
          const name = await WebOS.prompt('New file name', 'untitled.txt', 'notes.txt');
          if (name) { await WebOS.api.fs.write(cwd.replace(/\/$/, '') + '/' + name, ''); refresh(); }
        }
        if (act === 'rename' && sel) {
          const name = await WebOS.prompt('Rename "' + sel.name + '"', sel.name);
          if (name && name !== sel.name) { await WebOS.api.fs.move(join(cwd, sel.name), join(cwd, name)); sel = null; refresh(); }
        }
        if (act === 'delete' && sel) {
          const ok = await WebOS.confirm('Delete "' + sel.name + '"?');
          if (ok) { await WebOS.api.fs.rm(join(cwd, sel.name), true); sel = null; refresh(); }
        }
        if (act === 'download' && sel && sel.type === 'file') {
          const r = await WebOS.api.fs.read(join(cwd, sel.name));
          const blob = new Blob([r.content || ''], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url; link.download = sel.name; link.click();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
        }
      });

      function join(base, name) { return (base.replace(/\/$/, '') || '') + '/' + name; }
      function setSel(entry) {
        sel = entry;
        toolbar.querySelector('[data-a="rename"]').disabled = !sel;
        toolbar.querySelector('[data-a="delete"]').disabled = !sel;
        toolbar.querySelector('[data-a="download"]').disabled = !(sel && sel.type === 'file');
        Array.from(list.children).forEach(r => r.classList.toggle('sel', sel && r.dataset.name === sel.name));
      }

      async function refresh() {
        const r = await WebOS.api.fs.list(cwd);
        if (r.error) { list.innerHTML = `<div class="empty"><span class="big">⚠️</span>${esc(r.error)}</div>`; return; }
        cwd = r.path || cwd;
        pathin.value = cwd;
        a.setTitle('Files', cwd);
        list.innerHTML = '';
        if (!r.entries.length) list.innerHTML = '<div class="empty"><span class="big">📂</span>Ye folder khaali hai</div>';
        r.entries.forEach(entry => {
          const row = mk('div', 'row');
          row.dataset.name = entry.name;
          row.dataset.type = entry.type;
          row.innerHTML = `<span class="ic">${icon(entry)}</span><span>${esc(entry.name)}</span>
            <span class="meta">${entry.type === 'dir' ? entry.size + ' items' : fmt(entry.size)} · ${new Date(entry.modified).toLocaleDateString()}</span>`;
          row.onclick = () => setSel(entry);
          row.ondblclick = () => {
            if (entry.type === 'dir') { cwd = join(cwd, entry.name); sel = null; refresh(); }
            else WebOS.open('editor', { path: join(cwd, entry.name) });
          };
          list.appendChild(row);
        });
        const st = await WebOS.api.get('/api/fs/stats');
        status.innerHTML = `<span>${r.entries.length} items</span><span>disk: ${fmt(st.bytes || 0)} in ${st.files || 0} files</span><span>${esc(cwd)}</span>`;
        a.publishState({ cwd, entries: r.entries.map(x => ({ name: x.name, type: x.type, size: x.size })) });
      }

      async function buildSide() {
        const r = await WebOS.api.fs.list('/');
        side.innerHTML = '';
        const places = [['🏠 Home', '/Home'], ['📄 Documents', '/Home/Documents'], ['⬇ Downloads', '/Home/Downloads'], ['🛠 Projects', '/Home/Projects'], ['🖼 Pictures', '/Home/Pictures'], ['💿 / (root)', '/']];
        if (r.entries) r.entries.forEach(e => { if (e.type === 'dir' && !places.some(p => p[1] === '/' + e.name)) places.push(['📁 ' + e.name, '/' + e.name]); });
        places.forEach(([label, p]) => {
          const i = mk('div', 'item', label);
          i.dataset.path = p;
          i.onclick = () => { cwd = p; setSel(null); refresh(); };
          side.appendChild(i);
        });
      }

      buildSide(); refresh();
      return {
        handleCommand(cmd) {
          const args = cmd.args || {};
          const op = String(cmd.op || '').toLowerCase();
          if (op === 'list' || op === 'ls') {
            if (args.path) cwd = args.path;
            refresh();
            return { ok: true, path: cwd };
          }
          if (op === 'cd' || op === 'openpath') {
            if (!args.path) return { ok: false, error: 'args.path required' };
            cwd = args.path; sel = null; refresh();
            return { ok: true, path: cwd };
          }
          if (op === 'select') {
            const row = Array.from(list.children).find(r => r.dataset.name === (args.name || args.text));
            if (!row) return { ok: false, error: 'entry not found: ' + args.name };
            row.click();
            return { ok: true, selected: args.name };
          }
          if (op === 'openitem' || op === 'dblclick') {
            const row = Array.from(list.children).find(r => r.dataset.name === (args.name || args.text));
            if (!row) return { ok: false, error: 'entry not found' };
            row.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
            return { ok: true, opened: args.name };
          }
          return null;
        },
        state() { return { cwd, selected: sel && sel.name }; }
      };
    }
  });
})();

</script>
<script>
/* ============ Editor — text/markdown editor on the virtual FS ============ */
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function mk(t, c, h) { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; }

  WebOS.registerApp({
    id: 'editor', name: 'Editor', icon: '📝', width: 820, height: 580,
    mount(a) {
      let path = (a.args && (a.args.path || a.args.arg)) || null;
      let dirty = false;

      const root = a.win.body;
      const toolbar = mk('div', 'toolbar');
      toolbar.innerHTML = `
        <button class="tb-btn" data-a="new">＋ New</button>
        <button class="tb-btn" data-a="open">📂 Open</button>
        <button class="tb-btn primary" data-a="save">💾 Save</button>
        <button class="tb-btn" data-a="saveas">Save as…</button>
        <button class="tb-btn" data-a="download">⤓</button>
        <button class="tb-btn" data-a="preview">👁 Preview</button>
        <input class="inp mono" id="pathin" placeholder="/Home/Documents/notes.txt" spellcheck="false">`;
      const area = mk('textarea', 'editor');
      area.spellcheck = false;
      const status = mk('div', 'statusbar');
      root.appendChild(toolbar); root.appendChild(area); root.appendChild(status);

      const pathin = toolbar.querySelector('#pathin');
      pathin.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(pathin.value.trim()); });
      area.addEventListener('input', () => { dirty = true; setStatus(); });

      toolbar.addEventListener('click', async (e) => {
        const act = e.target.dataset && e.target.dataset.a;
        if (!act) return;
        if (act === 'new') { path = null; area.value = ''; dirty = false; pathin.value = ''; a.setTitle('Editor', 'untitled'); setStatus(); }
        if (act === 'open') {
          const p = await WebOS.prompt('Open file path', path || '/Home/Documents/welcome.txt');
          if (p) load(p);
        }
        if (act === 'save') {
          let p = path;
          if (!p) { p = await WebOS.prompt('Save as path', '/Home/Documents/untitled.txt'); if (!p) return; }
          const r = await WebOS.api.fs.write(p, area.value);
          if (r.error) { WebOS.notify(r.error, 'err', 'save failed'); return; }
          path = p; pathin.value = p; dirty = false;
          a.setTitle('Editor', p.split('/').pop());
          WebOS.notify('Saved ' + p, 'ok', 'editor');
          setStatus();
          a.publishState({ path, bytes: area.value.length, dirty: false });
        }
        if (act === 'saveas') {
          const p = await WebOS.prompt('Save as path', path || '/Home/Documents/untitled.txt');
          if (!p) return;
          path = p; pathin.value = p;
          const r = await WebOS.api.fs.write(p, area.value);
          if (!r.error) { dirty = false; WebOS.notify('Saved ' + p, 'ok', 'editor'); }
          setStatus();
        }
        if (act === 'download') {
          const blob = new Blob([area.value], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const l = document.createElement('a');
          l.href = url; l.download = (path || 'untitled.txt').split('/').pop(); l.click();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
        }
        if (act === 'preview') togglePreview();
      });

      /* markdown-ish preview */
      let previewing = false;
      const previewEl = mk('div', 'doc');
      previewEl.style.cssText = 'flex:1;overflow:auto;padding:16px';
      previewEl.style.display = 'none';
      root.insertBefore(previewEl, status);
      function mdToHtml(md) {
        let h = esc(md);
        h = h.replace(/^### (.*)$/gm, '<h3>$1</h3>')
             .replace(/^## (.*)$/gm, '<h2>$1</h2>')
             .replace(/^# (.*)$/gm, '<h1>$1</h1>')
             .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
             .replace(/`([^`]+)`/g, '<code>$1</code>')
             .replace(/^\- (.*)$/gm, '<li>$1</li>')
             .replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m + '</ul>')
             .replace(/\n{2,}/g, '</p><p>');
        return '<p>' + h.replace(/\n/g, '<br>') + '</p>';
      }
      function togglePreview() {
        previewing = !previewing;
        area.style.display = previewing ? 'none' : 'block';
        previewEl.style.display = previewing ? 'block' : 'none';
        if (previewing) previewEl.innerHTML = mdToHtml(area.value);
      }

      async function load(p) {
        if (!p) return;
        const r = await WebOS.api.fs.read(p);
        if (r.error) {
          // File abhi exist nahi karta -> naya file banao (path yaad rakho, Save se create ho jayega).
          // Agent ke liye bhi yahi behaviour chahiye: open + edit + save = create.
          if (/no such file/i.test(r.error)) {
            path = p; area.value = ''; dirty = false;
            pathin.value = p;
            a.setTitle('Editor', p.split('/').pop() + ' (new)');
            setStatus();
            a.publishState({ path, bytes: 0, dirty: false, isNew: true });
            return;
          }
          WebOS.notify(r.error, 'err', 'editor');
          return;
        }
        path = r.path; area.value = r.content || ''; dirty = false;
        pathin.value = path;
        a.setTitle('Editor', path.split('/').pop());
        setStatus();
        a.publishState({ path, bytes: area.value.length, dirty: false });
      }

      function setStatus() {
        const lines = area.value.split('\n').length;
        status.innerHTML = `<span>${path ? esc(path) : 'unsaved'}</span><span>${lines} lines · ${area.value.length} chars</span><span>${dirty ? '● unsaved changes' : 'saved'}</span>`;
      }

      if (path) load(path); else { a.setTitle('Editor', 'untitled'); setStatus(); }

      return {
        handleCommand(cmd) {
          const args = cmd.args || {};
          const op = String(cmd.op || '').toLowerCase();
          if (['edit', 'append', 'insert', 'setcontent', 'replace'].includes(op)) {
            if (args.path) path = args.path;
            const text = String(args.text != null ? args.text : args.content != null ? args.content : '');
            if (op === 'append' || op === 'insert') area.value += (area.value.endsWith('\n') || !area.value ? '' : '\n') + text;
            else area.value = text;
            area.dispatchEvent(new Event('input', { bubbles: true }));
            if (args.save) {
              const p = path || args.path;
              if (p) WebOS.api.fs.write(p, area.value).then(() => { dirty = false; setStatus(); });
            }
            return { ok: true, path, bytes: area.value.length };
          }
          if (op === 'read' || op === 'getcontent') {
            return { ok: true, path, content: area.value, bytes: area.value.length, dirty };
          }
          if (op === 'save') {
            if (!path) return { ok: false, error: 'no path — use saveas {path}' };
            WebOS.api.fs.write(path, area.value);
            dirty = false; setStatus();
            return { ok: true, path, bytes: area.value.length };
          }
          if (op === 'saveas') {
            if (!args.path) return { ok: false, error: 'args.path required' };
            path = args.path; pathin.value = path;
            WebOS.api.fs.write(path, area.value);
            dirty = false; setStatus();
            return { ok: true, path };
          }
          if (op === 'preview') { if (!previewing) togglePreview(); return { ok: true }; }
          return null;
        },
        state() { return { path, bytes: area.value.length, dirty }; }
      };
    }
  });
})();

</script>
<script>
/* ============ Terminal — WebOS shell ============ */
(function () {
  'use strict';
  function mk(t, c, h) { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  WebOS.registerApp({
    id: 'terminal', name: 'Terminal', icon: '⌨️', width: 760, height: 460,
    mount(a) {
      let cwd = (a.args && (a.args.cwd || a.args.path)) || '/Home';
      const sessionId = 'term-' + a.win.id;
      const hist = [];
      let hp = -1;

      const root = a.win.body;
      const out = mk('div', 'term');
      const row = mk('div', 'term-input-row');
      row.innerHTML = `<span class="ps1"></span><input spellcheck="false" autocomplete="off" placeholder="type a command… (help)">`;
      root.appendChild(out); root.appendChild(row);

      const ps1 = row.querySelector('.ps1');
      const input = row.querySelector('input');
      const setPs1 = () => { ps1.textContent = 'agent@webos:' + cwd + '$'; a.setTitle('Terminal', cwd); };

      function print(text, cls) {
        const d = mk('div', 'line ' + (cls || ''), esc(text));
        out.appendChild(d);
        out.scrollTop = out.scrollHeight;
      }
      function printf(html, cls) {
        const d = mk('div', 'line ' + (cls || ''), html);
        out.appendChild(d);
        out.scrollTop = out.scrollHeight;
      }

      print('WebOS shell 1.0  —  `help` likho commands ke liye, `apps` se saare apps dekho');
      print('');

      async function exec(line) {
        if (!line.trim()) return;
        hist.push(line); hp = hist.length;
        printf('<span class="cmd">agent@webos:' + esc(cwd) + '$</span> ' + esc(line));
        try {
          const r = await WebOS.api.shell(line, cwd);
          if (r.out === '__CLEAR__') { out.innerHTML = ''; }
          else if (r.out) print(r.out, r.code === 0 ? '' : 'err');
          if (r.cwd && r.cwd !== cwd) { cwd = r.cwd; setPs1(); }
          if (r.code !== 0 && r.out && !r.out.trim().startsWith('command not found')) { /* already printed */ }
          a.publishState({ cwd, lastCommand: line });
        } catch (e) {
          print('shell error: ' + e.message, 'err');
        }
      }

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const v = input.value;
          input.value = '';
          exec(v);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (hp > 0) { hp--; input.value = hist[hp] || ''; }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (hp < hist.length - 1) { hp++; input.value = hist[hp] || ''; } else { hp = hist.length; input.value = ''; }
        } else if (e.key === 'l' && e.ctrlKey) {
          e.preventDefault(); out.innerHTML = '';
        }
      });
      setTimeout(() => input.focus(), 200);

      if (a.args && a.args.cmd) setTimeout(() => exec(a.args.cmd), 300);

      return {
        handleCommand(cmd) {
          const args = cmd.args || {};
          const op = String(cmd.op || '').toLowerCase();
          if (op === 'shell' || op === 'run' || op === 'exec') {
            const c = args.cmd || args.command || args.text;
            if (!c) return { ok: false, error: 'args.cmd required' };
            return new Promise(async (resolve) => {
              const r = await WebOS.api.shell(c, args.cwd || cwd);
              if (r.cwd) { cwd = r.cwd; setPs1(); }
              printf('<span class="cmd">agent@webos:' + esc(cwd) + '$</span> ' + esc(c));
              if (r.out && r.out !== '__CLEAR__') print(r.out, r.code === 0 ? '' : 'err');
              a.publishState({ cwd, lastCommand: c });
              resolve({ ok: r.code === 0, out: r.out, code: r.code, cwd: r.cwd });
            });
          }
          if (op === 'focusinput') { input.focus(); return { ok: true }; }
          return null;
        },
        state() { return { cwd, sessionId, history: hist.slice(-10) }; }
      };
    }
  });
})();

</script>
<script>
/* ============ Agent Console — live view of agent <-> OS traffic ============ */
(function () {
  'use strict';
  function mk(t, c, h) { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  WebOS.registerApp({
