<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebOS 1.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">
<style>
/* ================= WebOS 1.0 — desktop theme ================= */
:root {
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --accent: #6b8cff;
  --accent-2: #a678ff;
  --ok: #35d07f;
  --warn: #ffb42e;
  --err: #ff5c6c;
  --radius: 12px;
  --blur: saturate(150%) blur(18px);
}

.theme-dark {
  --bg: #0c0e14;
  --wall: radial-gradient(1200px 800px at 15% 10%, #1d2b5e 0%, transparent 55%),
          radial-gradient(1000px 700px at 85% 85%, #43206b 0%, transparent 55%),
          linear-gradient(160deg, #0a0c12 0%, #131726 55%, #0a0c12 100%);
  --surface: rgba(20, 23, 34, .86);
  --surface-2: rgba(29, 33, 47, .92);
  --surface-3: rgba(38, 43, 60, .9);
  --line: rgba(255, 255, 255, .09);
  --text: #e9edf7;
  --muted: #99a2bb;
  --shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 2px 0 rgba(255, 255, 255, .04) inset;
}
.theme-light {
  --bg: #eef1f8;
  --wall: radial-gradient(1200px 800px at 15% 10%, #cfdcff 0%, transparent 55%),
          radial-gradient(1000px 700px at 85% 85%, #e6d6ff 0%, transparent 55%),
          linear-gradient(160deg, #f6f8ff 0%, #e8ecf8 60%, #f6f8ff 100%);
  --surface: rgba(255, 255, 255, .92);
  --surface-2: rgba(255, 255, 255, .96);
  --surface-3: rgba(244, 246, 252, .96);
  --line: rgba(10, 20, 60, .12);
  --text: #131829;
  --muted: #5b6480;
  --shadow: 0 20px 50px rgba(20, 30, 70, .18), 0 1px 0 #fff inset;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font-family: inherit; color: inherit; }
.hidden { display: none !important; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(140, 150, 180, .35); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(140, 150, 180, .55); background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------------- boot ---------------- */
#boot {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: radial-gradient(700px 500px at 50% 40%, #1a2246 0%, #07080d 70%);
  color: #e9edf7; transition: opacity .45s ease;
}
#boot.boot-done { opacity: 0; pointer-events: none; }
.boot-logo { font-size: 68px; line-height: 1; color: #7c9cff; text-shadow: 0 0 40px rgba(124, 156, 255, .8); animation: spinIn 1.1s ease both; }
.boot-name { font-size: 34px; font-weight: 700; letter-spacing: .14em; }
.boot-sub { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #8d96b5; }
.boot-bar { width: 240px; height: 3px; background: rgba(255, 255, 255, .12); border-radius: 3px; overflow: hidden; margin-top: 12px; }
.boot-bar i { display: block; height: 100%; width: 38%; background: linear-gradient(90deg, #6b8cff, #a678ff); animation: slide 1.1s ease-in-out infinite; }
.boot-log { font: 11px/1.7 var(--mono); color: #7b849e; margin-top: 14px; height: 96px; overflow: hidden; text-align: left; width: 320px; }
@keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
@keyframes spinIn { from { transform: rotate(-90deg) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------------- desktop ---------------- */
#os { position: fixed; inset: 0; }
#wallpaper { position: absolute; inset: 0; background: var(--wall); background-size: cover; transition: background .4s ease; }
#desktop { position: absolute; inset: 0 0 46px 0; }
#windows { position: absolute; inset: 0; }

#icons { position: absolute; inset: 12px auto 12px 12px; display: flex; flex-direction: column; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.dicon {
  width: 92px; padding: 10px 6px; border-radius: 10px; text-align: center; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 6px; user-select: none;
  border: 1px solid transparent;
}
.dicon:hover { background: rgba(255, 255, 255, .09); border-color: var(--line); }
.dicon.sel { background: rgba(107, 140, 255, .22); border-color: rgba(107, 140, 255, .5); }
.dicon .ic { font-size: 30px; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .45)); }
.dicon .nm { font-size: 11.5px; color: #eaeefb; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); word-break: break-word; }

/* ---------------- windows ---------------- */
.win {
  position: absolute; min-width: 320px; min-height: 200px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  display: flex; flex-direction: column; overflow: hidden;
  animation: winIn .16s ease both;
}
@keyframes winIn { from { transform: scale(.97) translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.win.max { border-radius: 0; }
.win.min { display: none; }
.win-titlebar {
  height: 38px; flex: 0 0 38px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .015));
  border-bottom: 1px solid var(--line); cursor: grab; user-select: none;
}
.theme-light .win-titlebar { background: linear-gradient(180deg, #f3f5fd, #e9edf8); }
.win-titlebar:active { cursor: grabbing; }
.win-icon { font-size: 15px; }
.win-title { flex: 1; font-size: 12.5px; font-weight: 600; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win-title .sub { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 11px; }
.win-controls { display: flex; gap: 4px; }
.win-controls button {
  width: 26px; height: 24px; border: 0; border-radius: 7px; background: transparent; color: var(--muted);
  font-size: 13px; line-height: 1; cursor: pointer;
}
.win-controls button:hover { background: rgba(255, 255, 255, .12); color: var(--text); }
.theme-light .win-controls button:hover { background: rgba(10, 20, 60, .1); }
.win-controls .win-close:hover { background: var(--err); color: #fff; }
.win-body { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.win-resize { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; z-index: 5; }
.win-resize::after {
  content: ''; position: absolute; right: 3px; bottom: 3px; width: 7px; height: 7px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); opacity: .6;
}
.win.focus { border-color: rgba(107, 140, 255, .45); }

/* ---------------- taskbar ---------------- */
#taskbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: flex; align-items: center; gap: 8px;
  padding: 0 10px; background: var(--surface-2); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border-top: 1px solid var(--line); z-index: 500;
}
#startBtn {
  display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 9px;
  border: 1px solid var(--line); background: linear-gradient(135deg, rgba(107, 140, 255, .28), rgba(166, 120, 255, .22));
  color: var(--text); cursor: pointer; font-size: 12.5px; font-weight: 600;
}
#startBtn:hover { filter: brightness(1.2); }
.start-mark { color: var(--accent); font-size: 15px; }
#tasklist { flex: 1; display: flex; gap: 6px; overflow-x: auto; }
.task {
  display: flex; align-items: center; gap: 7px; height: 34px; max-width: 210px; padding: 0 12px;
  border-radius: 9px; border: 1px solid transparent; background: rgba(255, 255, 255, .05);
  color: var(--text); font-size: 12px; cursor: pointer; white-space: nowrap; overflow: hidden;
}
.theme-light .task { background: rgba(10, 20, 60, .06); }
.task:hover { background: rgba(255, 255, 255, .12); }
.task.active { background: rgba(107, 140, 255, .26); border-color: rgba(107, 140, 255, .4); }
.task span.t { overflow: hidden; text-overflow: ellipsis; }
.tray { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.pill { display: flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 20px; background: rgba(255, 255, 255, .07); font-size: 11px; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #666e88; }
.pill.on .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.pill.busy .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse .9s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.tray-btn { background: transparent; border: 0; cursor: pointer; font-size: 14px; color: var(--muted); padding: 4px 6px; border-radius: 7px; }
.tray-btn:hover { background: rgba(255, 255, 255, .1); color: var(--text); }
#clock { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text); min-width: 62px; text-align: right; }

/* ---------------- start menu ---------------- */
#startmenu {
  position: absolute; left: 10px; bottom: 54px; width: 320px; z-index: 600;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); overflow: hidden;
  animation: winIn .14s ease both;
}
.sm-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px 8px; font-size: 13px; }
.sm-head span { font-size: 11px; color: var(--muted); }
.sm-apps { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 6px 10px 10px; max-height: 340px; overflow: auto; }
.sm-app { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; cursor: pointer; font-size: 12.5px; }
.sm-app:hover { background: rgba(107, 140, 255, .2); }
.sm-app .ic { font-size: 18px; }
.sm-foot { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--muted); }
.sm-foot code { font-family: var(--mono); font-size: 10.5px; }

/* ---------------- toasts ---------------- */
#toasts { position: absolute; right: 14px; bottom: 58px; display: flex; flex-direction: column; gap: 8px; z-index: 700; max-width: 340px; }
.toast {
  background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 10px; padding: 11px 14px; box-shadow: var(--shadow); font-size: 12.5px;
  animation: toastIn .22s ease both; backdrop-filter: var(--blur);
}
.toast.ok { border-left-color: var(--ok); }
.toast.err { border-left-color: var(--err); }
.toast.warn { border-left-color: var(--warn); }
.toast b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 3px; }
@keyframes toastIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------------- shared app widgets ---------------- */
.toolbar {
  display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, .03); flex: 0 0 auto;
}
.theme-light .toolbar { background: #f4f6fc; }
.tb-btn {
  height: 28px; min-width: 28px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, .06); color: var(--text); font-size: 12px; cursor: pointer;
}
.theme-light .tb-btn { background: #fff; }
.tb-btn:hover { background: rgba(107, 140, 255, .22); border-color: rgba(107, 140, 255, .4); }
.tb-btn:disabled { opacity: .4; cursor: default; }
.tb-btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; font-weight: 600; }
.inp {
  flex: 1; height: 30px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line);
  background: rgba(0, 0, 0, .22); color: var(--text); font-size: 12.5px; outline: none;
}
.theme-light .inp { background: #fff; }
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(107, 140, 255, .18); }
.statusbar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 5px 10px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.mono { font-family: var(--mono); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 8px; color: var(--muted); font-size: 12.5px; text-align: center; padding: 20px; }
.empty .big { font-size: 34px; }

/* file browser / lists */
.split { display: flex; flex: 1; min-height: 0; }
.side { width: 190px; flex: 0 0 190px; border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
.side .item { padding: 7px 9px; border-radius: 8px; font-size: 12px; cursor: pointer; display: flex; gap: 7px; align-items: center; }
.side .item:hover { background: rgba(255, 255, 255, .08); }
.side .item.active { background: rgba(107, 140, 255, .24); }
.list { flex: 1; overflow: auto; padding: 6px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; cursor: pointer; }
.row:hover { background: rgba(255, 255, 255, .07); }
.row.sel { background: rgba(107, 140, 255, .22); }
.row .ic { font-size: 16px; }
.row .meta { margin-left: auto; font-size: 11px; color: var(--muted); }

textarea.editor, .editor-area {
  flex: 1; width: 100%; resize: none; border: 0; outline: none; padding: 14px;
  background: transparent; color: var(--text); font: 13px/1.65 var(--mono);
}

/* terminal */
.term { flex: 1; overflow: auto; padding: 12px 14px; font: 12.5px/1.6 var(--mono); background: rgba(0, 0, 0, .3); }
.theme-light .term { background: #10131c; color: #dbe3f5; }
.term .line { white-space: pre-wrap; word-break: break-word; }
.term .cmd { color: #8be28b; }
.term .err { color: #ff8591; }
.term-input-row { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); background: rgba(0, 0, 0, .18); }
.term-input-row .ps1 { color: var(--accent); font: 12.5px var(--mono); align-self: center; white-space: nowrap; }
.term-input-row input { flex: 1; background: transparent; border: 0; outline: none; font: 12.5px var(--mono); color: var(--text); }

/* browser */
.br-frame { flex: 1; position: relative; background: #fff; }
.br-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.br-tabview { position: absolute; inset: 0; background: #fff; }
.br-progress { position: absolute; left: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0; transition: width .25s ease; }
.br-progress.on { width: 92%; }
.br-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--muted); font-size: 12.5px; gap: 10px; }
.spin { width: 15px; height: 15px; border: 2px solid rgba(140, 150, 180, .35); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.br-side { width: 300px; flex: 0 0 300px; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.br-side.hide { display: none; }
.tabs { display: flex; gap: 3px; overflow-x: auto; padding: 4px 6px 0; background: rgba(0, 0, 0, .16); }
.theme-light .tabs { background: #e9edf8; }
.tab {
  display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 8px 8px 0 0; font-size: 11.5px;
  max-width: 190px; cursor: pointer; background: rgba(255, 255, 255, .05); color: var(--muted);
}
.tab.active { background: var(--surface); color: var(--text); }
.tab .x { opacity: .6; font-size: 12px; }
.tab .x:hover { opacity: 1; color: var(--err); }
.tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 6px 6px 0; }
.panel-tabs button { flex: 1; padding: 7px 4px; border: 0; background: transparent; color: var(--muted); font-size: 11.5px; cursor: pointer; border-bottom: 2px solid transparent; }
.panel-tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.panel-body { flex: 1; overflow: auto; padding: 10px; font-size: 12px; }
.el { padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); margin-bottom: 5px; cursor: pointer; background: rgba(255, 255, 255, .03); }
.el:hover { background: rgba(107, 140, 255, .18); }
.el .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-right: 6px; }
.el .u { color: var(--muted); font-size: 10.5px; word-break: break-all; }
.reader-text { white-space: pre-wrap; font-size: 12px; line-height: 1.65; }
.kbd { font: 10.5px var(--mono); padding: 2px 5px; border-radius: 5px; background: rgba(255, 255, 255, .1); border: 1px solid var(--line); }

/* agent console */
.ag-log { flex: 1; overflow: auto; padding: 8px; font: 11.5px/1.6 var(--mono); }
.ag-row { display: flex; gap: 8px; padding: 4px 6px; border-radius: 6px; }
.ag-row:hover { background: rgba(255, 255, 255, .05); }
.ag-row .ts { color: var(--muted); flex: 0 0 74px; }
.ag-row .kind { flex: 0 0 68px; font-weight: 700; }
.kind.cmd { color: var(--accent); }
.kind.ok { color: var(--ok); }
.kind.error { color: var(--err); }
.kind.timeout { color: var(--warn); }
.kind.system { color: var(--muted); }
.ag-row .txt { flex: 1; word-break: break-word; }

/* settings + misc */
.section { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.section h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 9px; cursor: pointer; border: 2px solid transparent; }
.sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
.wall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.wall { height: 62px; border-radius: 9px; cursor: pointer; border: 2px solid transparent; }
.wall.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
.rowline { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: 12.5px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 12px; }
.kv b { color: var(--muted); font-weight: 500; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; }
.calc-grid button { height: 52px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); font-size: 16px; cursor: pointer; }
.calc-grid button:hover { background: rgba(107, 140, 255, .22); }
.calc-out { text-align: right; padding: 16px; font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; overflow: hidden; }
.doc h1 { font-size: 20px; margin: 4px 0 10px; }
.doc h2 { font-size: 15px; margin: 18px 0 8px; color: var(--accent); }
.doc code { font-family: var(--mono); font-size: 11.5px; background: rgba(255, 255, 255, .09); padding: 2px 5px; border-radius: 5px; }
.theme-light .doc code { background: rgba(10, 20, 60, .07); }
.doc pre { background: rgba(0, 0, 0, .3); padding: 10px 12px; border-radius: 9px; overflow: auto; font-size: 11.5px; border: 1px solid var(--line); }
.theme-light .doc pre { background: #f2f4fb; }
.doc table { border-collapse: collapse; font-size: 12px; width: 100%; }
.doc th, .doc td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
.doc p, .doc li { font-size: 12.5px; line-height: 1.7; }
.doc { padding: 6px 4px; }
.badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 20px; background: rgba(107, 140, 255, .25); border: 1px solid rgba(107, 140, 255, .4); }
.mon-bar { height: 8px; border-radius: 5px; background: rgba(255, 255, 255, .09); overflow: hidden; }
.mon-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }


/* ================= Chromium app (real headless Chromium) ================= */
.cr-root { display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--surface); }
.cr-top { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.cr-nav, .cr-sess { display: flex; gap: 4px; align-items: center; }
.cr-btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--text); border-radius: 8px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
.cr-btn:hover { background: var(--surface-3); }
.cr-btn.cr-x:hover { color: var(--err); border-color: var(--err); }
.cr-url { flex: 1; min-width: 160px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 5px 9px; font-size: 12.5px; font-family: var(--mono); }
.cr-go { border-color: var(--accent); color: var(--accent); font-weight: 600; }

<!-- ============ SCRIPTS (inlined standalone bundle) ============ -->
<script>
/* WebOS standalone build — generated by tools/build-standalone.js.
   Do not edit this file: edit public/** and re-run the build script. */
window.WEBOS_LOCAL = true;
</script>
<script>
/* ============================================================
   local.js — WebOS "local mode"
   ------------------------------------------------------------
   Activates only when window.WEBOS_LOCAL === true (single-file build).
   It gives the OS a complete client-side backend so the UI works with
   NO server at all: virtual filesystem (localStorage), shell, agent bus
   and status endpoints. It installs a fetch() shim that answers /api/*
   requests locally, so none of the app code had to change.
   ============================================================ */
(function () {
  'use strict';
  if (!window.WEBOS_LOCAL) return;

  const LS_FS = 'webos.local.fs';
  const VERSION = '1.0.0-local';

  /* ---------------- virtual filesystem ---------------- */
  const now = () => Date.now();
  const fileNode = (name, content = '') => ({ type: 'file', name, content, created: now(), modified: now() });
  const dirNode = (name) => ({ type: 'dir', name, children: {}, created: now(), modified: now() });

  function seed() {
    const r = dirNode('');
    r.children.Home = dirNode('Home');
    const H = r.children.Home;
    H.children.Documents = dirNode('Documents');
    H.children.Downloads = dirNode('Downloads');
    H.children.Projects = dirNode('Projects');
    H.children.Pictures = dirNode('Pictures');
    H.children['AGENT.md'] = fileNode('AGENT.md', [
      '# WebOS — local mode',
      '',
      'Ye single-file build hai: poora OS browser ke andar hi chalta hai.',
      '',
      'Kaam karta hai:',
      '  - window manager, saare apps, themes, notifications',
      '  - virtual filesystem (browser ke localStorage me persist)',
      '  - shell (ls, cd, cat, mkdir, write, open, theme, notify ...)',
      '  - agent commands: console me chalao —',
      '      WebOS.handleCommand({op:"open",app:"files"})',
      '      WebOS.handleCommand({op:"shadow", app:"browser", args:{url:"https://example.com"}})',
      '',
      'Server mode (node server.js) me extra milta hai:',
      '  - real web proxy (kisi bhi site ko OS browser me kholna)',
      '  - page padhna / click / type (agent refs)',
      '  - multi-engine web search',
      '  - agent ke liye HTTP API: /api/agent/cmd, /api/agent/state',
      ''
    ].join('\n'));
    H.children.Documents.children['welcome.txt'] = fileNode('welcome.txt',
      'Welcome to WebOS (local mode)\n\nYe file browser ke localStorage me hai — refresh ke baad bhi rahegi.\n');
    H.children.Documents.children['agent-quickstart.md'] = fileNode('agent-quickstart.md',
      '# Agent quickstart (local mode)\n\nConsole me:\n  WebOS.handleCommand({op:"open",app:"browser",args:{url:"https://example.com"}})\n  WebOS.handleCommand({op:"theme",args:{mode:"light"}})\n  WebOS.handleCommand({op:"read"})\n');
    H.children.Projects.children['notes.txt'] = fileNode('notes.txt', 'TODO:\n- [ ] server deploy karo (proxy + agent API ke liye)\n');
    H.children.Pictures.children['README.txt'] = fileNode('README.txt', 'Pictures folder khaali hai.\n');
    return r;
  }

  let root = null;
  function load() {
    if (root) return root;
    try {
      const raw = localStorage.getItem(LS_FS);
      if (raw) { root = JSON.parse(raw); if (!root || root.type !== 'dir') root = seed(); }
      else { root = seed(); save(); }
    } catch (e) { root = seed(); }
    return root;
  }
  function save() { try { localStorage.setItem(LS_FS, JSON.stringify(root)); } catch (e) {} }
  const parts = (p) => String(p || '').split('/').map(s => s.trim()).filter(s => s && s !== '.');
  const normalize = (p) => '/' + parts(p).join('/');

  function get(pathStr) {
    let node = load();
    for (const part of parts(pathStr)) {
      if (!node || node.type !== 'dir') return null;
      node = node.children[part];
      if (!node) return null;
    }
    return node;
  }
  function parentOf(pathStr) {
    const ps = parts(pathStr);
    if (!ps.length) return { parent: null, name: null };
    return { parent: get('/' + ps.slice(0, -1).join('/')), name: ps[ps.length - 1] };
  }

  const vfs = {
    list(pathStr) {
      const n = get(pathStr);
      if (!n) return { error: 'no such directory: ' + pathStr };
      if (n.type !== 'dir') return { error: 'not a directory: ' + pathStr };
      const entries = Object.values(n.children).map(x => ({
        name: x.name, type: x.type,
        size: x.type === 'file' ? (x.content || '').length : Object.keys(x.children).length,
        modified: x.modified
      })).sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : (a.type === 'dir' ? -1 : 1)));
      return { path: normalize(pathStr), entries };
    },
    read(pathStr) {
      const n = get(pathStr);
      if (!n) return { error: 'no such file: ' + pathStr };
      if (n.type !== 'file') return { error: 'is a directory: ' + pathStr };
      return { path: normalize(pathStr), content: n.content || '', size: (n.content || '').length, modified: n.modified };
    },
    write(pathStr, content) {
      const ps = parts(pathStr);
      if (!ps.length) return { error: 'invalid path' };
      const dirPath = '/' + ps.slice(0, -1).join('/');
      let dir = get(dirPath);
      if (!dir || dir.type !== 'dir') { vfs.mkdir(dirPath, true); dir = get(dirPath); }
      if (!dir) return { error: 'no such directory: ' + dirPath };
      const name = ps[ps.length - 1];
      const ex = dir.children[name];
      if (ex && ex.type === 'dir') return { error: 'is a directory: ' + pathStr };
      if (ex) { ex.content = String(content == null ? '' : content); ex.modified = now(); }
      else dir.children[name] = fileNode(name, content);
      dir.modified = now(); save();
      return { ok: true, path: normalize(pathStr), bytes: String(content || '').length, action: ex ? 'updated' : 'created' };
    },
    mkdir(pathStr, createParents) {
      const ps = parts(pathStr);
      let node = load();
      for (let i = 0; i < ps.length; i++) {
        const name = ps[i];
        if (!node.children[name]) {
          if (i !== ps.length - 1 && !createParents) return { error: 'no such directory: /' + ps.slice(0, i + 1).join('/') };
          node.children[name] = dirNode(name);
        } else if (node.children[name].type !== 'dir') return { error: 'not a directory: /' + ps.slice(0, i + 1).join('/') };
        node = node.children[name];
      }
      save();
      return { ok: true, path: normalize(pathStr), action: 'created' };
    },
    rm(pathStr, recursive) {
      const { parent, name } = parentOf(pathStr);
      if (!parent || !name) return { error: 'cannot remove root' };
      const node = parent.children[name];
      if (!node) return { error: 'no such file or directory: ' + pathStr };
      if (node.type === 'dir' && !recursive && Object.keys(node.children).length) return { error: 'directory not empty (use rm -r)' };
      delete parent.children[name]; save();
      return { ok: true, path: normalize(pathStr), action: 'removed' };
    },
    move(from, to, copy) {
      const src = get(from);
      if (!src) return { error: 'no such file: ' + from };
      const clone = JSON.parse(JSON.stringify(src));
      const dst = get(to);
      const name = parts(to).pop();
      if (dst && dst.type === 'dir') { dst.children[parts(from).pop()] = clone; dst.modified = now(); }
      else {
        const { parent, name: dn } = parentOf(to);
        if (!parent) return { error: 'bad destination: ' + to };
        clone.name = dn; parent.children[dn] = clone; parent.modified = now();
      }
      if (!copy) { const { parent: sp, name: sn } = parentOf(from); if (sp && sn) delete sp.children[sn]; }
      save();
      return { ok: true, from: normalize(from), to: normalize(to), action: copy ? 'copied' : 'moved' };
    },
    tree(pathStr, depth) {
      const n = get(pathStr || '/');
      if (!n) return { error: 'no such path: ' + pathStr };
      const out = [];
      const walk = (node, d, prefix) => {
        if (node.type === 'file') { out.push({ path: prefix + node.name, type: 'file', size: (node.content || '').length }); return; }
        if (d > 0) Object.keys(node.children).sort().forEach(k => walk(node.children[k], d - 1, prefix + node.name + '/'));
      };
      walk(n, depth || 3, '');
      return { path: normalize(pathStr), entries: out };
    },
    search(query, pathStr) {
      const needle = String(query || '').toLowerCase();
      const hits = [];
      const walk = (n, prefix) => {
        if (n.type === 'file') {
          const idx = (n.content || '').toLowerCase().indexOf(needle);
          if (idx >= 0) hits.push({ path: prefix + n.name, line: (n.content || '').slice(0, idx).split('\n').length, snippet: (n.content || '').slice(Math.max(0, idx - 40), idx + 80).replace(/\n/g, ' ') });
          return;
        }
        Object.keys(n.children).forEach(k => walk(n.children[k], prefix + n.name + '/'));
      };
      walk(get(pathStr || '/') || load(), '/');
      return { query, hits, count: hits.length };
    },
    stats() {
      let files = 0, dirs = 0, bytes = 0;
      const walk = (n) => { if (n.type === 'file') { files++; bytes += (n.content || '').length; return; } dirs++; Object.values(n.children).forEach(walk); };
      walk(load());
      return { files, dirs, bytes };
    }
  };

  /* ---------------- shell ---------------- */
  const HELP = `WebOS Shell (local mode)
  help  ls [path]  cd <path>  pwd  cat <file>
  echo "text" [> file]   write <file> "text"   mkdir <dir>   touch <file>
  rm [-r] <path>  cp <src> <dst>  mv <src> <dst>  tree [path]  find <text>
  open <app>   browse <url>   apps   windows   sysinfo   date   whoami   clear
  theme <dark|light>   wallpaper <css>

Server mode (node server.js) me extra: read <url>, search <query>, agent <op>`;

  function tokenize(line) {
    const out = []; let cur = '', q = null;
    for (const c of line) {
      if (q) { if (c === q) q = null; else cur += c; }
      else if (c === '"' || c === "'") q = c;
      else if (/\s/.test(c)) { if (cur) { out.push(cur); cur = ''; } }
      else cur += c;
    }
    if (cur) out.push(cur);
    return out;
  }
  function joinPath(cwd, p) {
    if (!p) return cwd;
    if (p.startsWith('/')) return '/' + parts(p).join('/');
    const base = parts(cwd);
    for (const part of parts(p)) { if (part === '..') base.pop(); else base.push(part); }
    return '/' + base.join('/');
  }
  const histories = [];

  async function run(cmdLine, cwd, isSub) {
    cwd = cwd || '/Home';
    const raw = String(cmdLine || '').trim();
    if (!raw) return { out: '', cwd, code: 0 };
    if (!isSub) histories.push(raw);

    // chaining:  a && b   |   a ; b
    const chain = raw.split(/\s*(?:&&|;)\s*/).filter(Boolean);
    if (chain.length > 1) {
      let outs = [], cur = cwd, code = 0;
      for (const part of chain) {
        const r = await run(part, cur, true);
        cur = r.cwd; code = r.code;
        if (r.out) outs.push(r.out);
        if (code !== 0) break;
      }
      return { out: outs.join('\n'), cwd: cur, code };
    }

    let redirect = null;
    const rm = /\s(>>?)\s*(\S+)\s*$/.exec(raw);
    let line = raw;
    if (rm) { redirect = { mode: rm[1], path: joinPath(cwd, rm[2]) }; line = raw.slice(0, rm.index).trim(); }
    const t = tokenize(line);
    const cmd = (t.shift() || '').toLowerCase();
    const rest = t.join(' ');

    const done = (out, code) => {
      out = out == null ? '' : String(out);
      if (redirect) {
        if (redirect.mode === '>>') { const r = vfs.read(redirect.path); vfs.write(redirect.path, ((r.content || '') + out + '\n')); }
        else vfs.write(redirect.path, out + '\n');
        return { out: '', cwd, code: code || 0 };
      }
      return { out, cwd, code: code || 0 };
    };
    const APPS = ['browser', 'files', 'editor', 'terminal', 'agent', 'calc', 'settings', 'docs', 'monitor', 'music'];

    switch (cmd) {
      case 'help': case '?': return done(HELP);
      case 'pwd': return done(cwd);
      case 'ls': case 'dir': {
        const r = vfs.list(joinPath(cwd, t[0] || ''));
        if (r.error) return done(r.error, 1);
        return done(r.entries.map(e => (e.type === 'dir' ? 'd ' : '- ') + e.name.padEnd(28) + (e.type === 'dir' ? '<DIR>' : e.size + ' b')).join('\n') || '(empty)');
      }
      case 'cd': {
        const target = joinPath(cwd, t[0] || '/');
        const r = vfs.list(target);
        if (r.error) return done(r.error, 1);
        return { out: '', cwd: r.path, code: 0 };
      }
      case 'cat': {
        if (!t[0]) return done('usage: cat <file>', 1);
        const r = vfs.read(joinPath(cwd, t[0]));
        return done(r.error || r.content, r.error ? 1 : 0);
      }
      case 'echo': return done(rest.replace(/^["']|["']$/g, ''));
      case 'write': {
        if (t.length < 2) return done('usage: write <file> <text>', 1);
        const r = vfs.write(joinPath(cwd, t[0]), t.slice(1).join(' ') + '\n');
        return done(r.error || ('written ' + r.bytes + ' bytes -> ' + r.path), r.error ? 1 : 0);
      }
      case 'mkdir': {
        const r = vfs.mkdir(joinPath(cwd, t[0] || ''), true);
        return done(r.error || '', r.error ? 1 : 0);
      }
      case 'touch': { const p = joinPath(cwd, t[0] || ''); if (vfs.read(p).error) vfs.write(p, ''); return done(''); }
      case 'rm': case 'del': {
        const rec = t[0] === '-r' || t[0] === '-rf';
        const r = vfs.rm(joinPath(cwd, t[rec ? 1 : 0] || ''), rec);
        return done(r.error || ('removed ' + r.path), r.error ? 1 : 0);
      }
      case 'cp': case 'mv': {
        if (t.length < 2) return done('usage: ' + cmd + ' <src> <dst>', 1);
        const r = vfs.move(joinPath(cwd, t[0]), joinPath(cwd, t[1]), cmd === 'cp');
        return done(r.error || '', r.error ? 1 : 0);
      }
      case 'tree': {
        const r = vfs.tree(joinPath(cwd, t[0] || ''), 3);
        return done(r.error || r.entries.map(e => (e.type === 'dir' ? '[D] ' : '    ') + e.path).join('\n') || '(empty)');
      }
      case 'find': case 'grep': {
        const r = vfs.search(t[0] || '', joinPath(cwd, t[1] || ''));
        return done(r.count ? r.hits.map(h => h.path + ':' + h.line + ': ' + h.snippet).join('\n') : 'no matches');
      }
      case 'date': return done(new Date().toString());
      case 'whoami': return done('agent');
      case 'uname': return done('WebOS ' + VERSION + ' (single-file, client-side)');
      case 'clear': return { out: '__CLEAR__', cwd, code: 0 };
      case 'apps': return done(APPS.join('\n'));
      case 'sysinfo': {
        const s = vfs.stats();
        return done(JSON.stringify({
          version: VERSION, mode: 'local', files: s.files, dirs: s.dirs, bytes: s.bytes,
          windows: (window.WebOS ? WebOS.windows.map(w => w.app + ':' + w.title) : []),
          online: navigator.onLine
        }, null, 2));
      }
      case 'windows': {
        const ws = window.WebOS ? WebOS.windows : [];
        return done(ws.length ? ws.map(w => `${w.focused ? '*' : ' '} [${w.id}] ${w.app} - ${w.title}`).join('\n') : 'no windows open');
      }
      case 'history': return done(histories.map((h, i) => String(i + 1).padStart(4) + '  ' + h).join('\n'));
      case 'open': {
        const app = (t[0] || '').toLowerCase();
        if (!APPS.includes(app)) return done('unknown app: ' + app + '\napps: ' + APPS.join(', '), 1);
        const args = t[1] ? { url: t[1], path: t[1], arg: t[1] } : {};
        const w = window.WebOS && WebOS.open(app, args);
        return done(w ? 'opened ' + app + ' [' + w.id + ']' : 'open failed', w ? 0 : 1);
      }
      case 'browse': {
        const url = t[0] || 'https://example.com';
        if (window.WebOS) WebOS.open('browser', { url });
        return done('browsing ' + url + '  (local mode: page OS iframe me khulti hai)');
      }
      case 'theme': {
        const mode = (t[0] || 'dark').toLowerCase();
        if (window.WebOS) WebOS.setTheme(mode);
        return done('theme: ' + mode);
      }
      case 'wallpaper': {
        if (window.WebOS) WebOS.setWallpaper(rest || null);
        return done('wallpaper updated');
      }
      case 'notify': {
        if (window.WebOS) WebOS.notify(rest || 'hello', 'ok');
        return done('notified');
      }
      case 'agent': {
        if (!window.WebOS) return done('os not ready', 1);
        const op = t[0] || 'state';
        if (op === 'state') return done(JSON.stringify(WebOS.state(), null, 2));
        let args = {};
        if (op === 'click') args = { ref: Number(t[1]) };
        else if (op === 'type') args = { ref: Number(t[1]), text: t.slice(2).join(' ') };
        else if (op === 'navigate') args = { url: t[1] };
        const res = await WebOS.handleCommand({ op, args, app: t[t.length - 1] });
        return done(JSON.stringify(res, null, 2));
      }
      case 'read':
      case 'search':
        return done('local mode me `' + cmd + '` nahi chalta — ye server (node server.js) ke proxy/search se aata hai.', 1);
      default:
        return done('command not found: ' + cmd + '  (try `help`)', 127);
    }
  }

  /* ---------------- agent log (in-page) ---------------- */
  const agentLog = [];
  let logSeq = 0;
  function pushLog(kind, text, extra) {
    const e = Object.assign({ seq: ++logSeq, ts: Date.now(), kind, text: String(text).slice(0, 400) }, extra || {});
    agentLog.push(e);
    if (agentLog.length > 400) agentLog.shift();
    return e;
  }
  pushLog('system', 'WebOS local mode started (single-file build)');

  /* ---------------- fetch shim ---------------- */
  function makeResponse(obj, status) {
    return {
      ok: (status || 200) < 400,
      status: status || 200,
      json: () => Promise.resolve(obj),
      text: () => Promise.resolve(typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2)),
      headers: { get: () => 'application/json' }
    };
  }

  async function route(pathname, query, init) {
    const body = init && init.body ? JSON.parse(init.body) : {};
    switch (pathname) {
      /* status */
      case '/api/ping': return makeResponse({ ok: true, version: VERSION, mode: 'local', clients: 0, ts: Date.now() });
      case '/api/meta': return makeResponse({
        name: 'WebOS (local mode)', version: VERSION, mode: 'local',
        apps: webosApps(), help: HELP,
        endpoints: { note: 'single-file build — koi server nahi chahiye' }
      });

      /* filesystem */
      case '/api/fs/list': return makeResponse(vfs.list(query.get('path') || '/'));
      case '/api/fs/read': return makeResponse(vfs.read(query.get('path') || ''));
      case '/api/fs/tree': return makeResponse(vfs.tree(query.get('path') || '/', Number(query.get('depth')) || 3));
      case '/api/fs/search': return makeResponse(vfs.search(query.get('q') || '', query.get('path') || '/'));
      case '/api/fs/stats': return makeResponse(vfs.stats());
      case '/api/fs/write': return makeResponse(body.action === 'append'
        ? (() => { const r = vfs.read(body.path || ''); return vfs.write(body.path || '', (r.content || '') + (body.content || '')); })()
        : vfs.write(body.path || '', body.content == null ? '' : body.content));
      case '/api/fs/mkdir': return makeResponse(vfs.mkdir(body.path || '', true));
      case '/api/fs/rm': return makeResponse(vfs.rm(body.path || '', body.recursive !== false));
      case '/api/fs/move': return makeResponse(vfs.move(body.from || '', body.to || '', !!body.copy));

      /* shell */
      case '/api/exec': return makeResponse(await run(body.cmd || body.command || '', body.cwd || '/Home'));

      /* agent bus (in-page) */
      case '/api/agent/state': {
        const st = (window.WebOS ? WebOS.state() : { windows: [] });
        return makeResponse(Object.assign({ connected: false, local: true, clients: 0, queueDepth: 0, ts: Date.now() }, st));
      }
      case '/api/agent/cmd': {
        const op = body.op || (body.cmd && body.cmd.op);
        const args = body.args || (body.cmd && body.cmd.args) || {};
        const app = body.app || (body.cmd && body.cmd.app);
        if (!op) return makeResponse({ ok: false, error: 'missing op' }, 400);
        if (!window.WebOS) return makeResponse({ ok: false, error: 'OS booting…' }, 503);
        pushLog('cmd', op + (app ? ' ' + app : ''), { args });
        const started = Date.now();
        try {
          const result = await WebOS.handleCommand({ op, app, args, id: 'local-' + logSeq });
          pushLog(result && result.ok === false ? 'error' : 'ok',
            op + (result && result.error ? ': ' + result.error : ''), { id: 'local-' + logSeq });
          const out = Object.assign({ ok: true, op, handledBy: result && result.handledBy || 'local', ms: Date.now() - started }, result || {});
          out.localNote = 'local mode: GUI commands chalte hain, web-proxy ops nahi.';
          return makeResponse(out);
        } catch (e) {
          pushLog('error', op + ': ' + e.message, {});
          return makeResponse({ ok: false, op, error: e.message }, 500);
        }
      }
      case '/api/agent/log': {
        const since = Number(query.get('since') || 0);
        return makeResponse({ log: agentLog.filter(e => e.seq > since), last: agentLog.length ? agentLog[agentLog.length - 1].seq : 0 });
      }
      case '/api/agent/inbox': return makeResponse({ commands: [] });
      case '/api/agent/report': case '/api/agent/result': return makeResponse({ ok: true });
      case '/api/agent/clients': return makeResponse({ clients: [], primary: null, local: true });

      /* web features need the server */
      case '/api/search': return makeResponse({ query: query.get('q') || '', engine: null, count: 0, results: [], errors: ['local mode: /api/search needs the Node server'] }, 200);
      case '/api/proxy': case '/api/proxy/raw': case '/api/proxy/text':
        return makeResponse({ error: 'local mode: web proxy needs the Node server (node server.js)', url: query.get('url') }, 501);

      default: return makeResponse({ error: 'not available in local mode: ' + pathname }, 404);
    }
  }

  let cachedApps = null;
  function webosApps() {
    try { return (window.WebOS ? WebOS.state().apps.map(a => a.id) : ['browser', 'files', 'editor', 'terminal', 'agent', 'calc', 'settings', 'docs', 'monitor', 'music']); }
    catch (e) { return ['browser', 'files', 'editor', 'terminal', 'agent', 'calc', 'settings', 'docs', 'monitor', 'music']; }
  }

  const origFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    // Sandboxed iframes (preview/embed) me document ka origin opaque hota hai —
    // tab relative URL parse hi nahi hota, isliye string ko bhi check karte hain.
    let u = null;
    try { u = new URL(url, location.href); } catch (e) { u = null; }
    const raw = String(url);
    const isApi = (u && u.pathname.indexOf('/api/') === 0) || /^\/api\//.test(raw) || /(^|\/)api\/[a-z]+\//i.test(raw);
    if (isApi) {
      const path = u ? u.pathname : (raw.split('?')[0] || '');
      const params = u ? u.searchParams : new URLSearchParams(raw.split('?')[1] || '');
      return route(path, params, init || {});
    }
    if (origFetch) return origFetch(input, init);
    return Promise.reject(new Error('offline (local mode)'));
  };

  /* expose for the console + tests */
  window.WebOSLocal = {
    version: VERSION,
    vfs,
    shell: (cmd, cwd) => run(cmd, cwd),
    log: () => agentLog.slice(),
    reset: () => { root = seed(); save(); pushLog('system', 'filesystem reset (local)'); return { ok: true }; }
  };
})();

</script>
<script>
/* ============================================================
   WebOS kernel — app registry, window manager, desktop shell
   ============================================================ */
(function () {
  'use strict';

  const APPS = {};            // id -> manifest
  const ORDER = [];           // desktop order
  const open_ = [];           // open instances (all apps)
  let zTop = 10;
  let winSeq = 0;
  let focusedId = null;
  const appStateFeed = {};    // appId -> last published state (for the agent)
  const settings = { theme: 'dark', accent: '#6b8cff', wallpaper: null };
  const listeners = {};

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  /* ---------------- tiny helpers ---------------- */
  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function nowTime() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function store(key, val) {
    try {
      if (val === undefined) { const v = localStorage.getItem('webos.' + key); return v ? JSON.parse(v) : null; }
      localStorage.setItem('webos.' + key, JSON.stringify(val));
    } catch (e) { return null; }
  }
  function on(evt, fn) { (listeners[evt] = listeners[evt] || []).push(fn); }
  function emit(evt, data) { (listeners[evt] || []).forEach(f => { try { f(data); } catch (e) { console.warn(e); } }); }

  /* ---------------- REST helpers ---------------- */
  const api = {
    async get(path, params) {
      const qs = params ? '?' + new URLSearchParams(params).toString() : '';
      const r = await fetch(path + qs);
      return r.json().catch(() => ({ error: 'bad json' }));
    },
    async post(path, body) {
      const r = await fetch(path, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body || {})
      });
      return r.json().catch(() => ({ error: 'bad json' }));
    },
    fs: {
      list: (p) => api.get('/api/fs/list', { path: p }),
      read: (p) => api.get('/api/fs/read', { path: p }),
      write: (p, c) => api.post('/api/fs/write', { path: p, content: c }),
      mkdir: (p) => api.post('/api/fs/mkdir', { path: p }),
      rm: (p, recursive = true) => api.post('/api/fs/rm', { path: p, recursive }),
      move: (from, to, copy) => api.post('/api/fs/move', { from, to, copy }),
      tree: (p, depth) => api.get('/api/fs/tree', { path: p, depth }),
      search: (q, p) => api.get('/api/fs/search', { q, path: p })
    },
    shell: (cmd, cwd) => api.post('/api/exec', { cmd, cwd }),
    search: (q) => api.get('/api/search', { q }),
    readUrl: (url) => api.get('/api/proxy/text', { url }),
    proxyUrl: (url) => '/api/proxy?url=' + encodeURIComponent(url)
  };

  /* ---------------- app registration ---------------- */
  function registerApp(manifest) {
    if (!manifest || !manifest.id) return;
    APPS[manifest.id] = Object.assign({
      name: manifest.id, icon: '▪', width: 760, height: 520, desktop: true, singleton: false
    }, manifest);
    if (manifest.desktop !== false && !ORDER.includes(manifest.id)) ORDER.push(manifest.id);
  }

  /* ---------------- window manager ---------------- */
  function desktopRect() {
    const d = $('#desktop').getBoundingClientRect();
    return { w: d.width, h: d.height };
  }

  function createWindow(appId, args) {
    const manifest = APPS[appId];
    if (!manifest) return null;
    if (manifest.singleton) {
      const existing = open_.find(w => w.app === appId);
      if (existing) {
        existing.restore(); existing.focus();
        if (existing.instance && existing.instance.onArgs) existing.instance.onArgs(args || {});
        return existing;
      }
    }
    const dr = desktopRect();
    const width = Math.min(manifest.width, Math.max(360, dr.w - 40));
    const height = Math.min(manifest.height, Math.max(240, dr.h - 40));
    const n = open_.length;
    const left = Math.max(8, Math.round((dr.w - width) / 2) + ((n % 5) - 2) * 26);
    const top = Math.max(8, Math.round((dr.h - height) / 2) + ((n % 5) - 2) * 22);

    const id = 'w' + (++winSeq);
    const root = el('div', 'win');
    root.dataset.id = id;
    root.dataset.app = appId;
    root.style.cssText = `left:${left}px;top:${top}px;width:${width}px;height:${height}px;z-index:${++zTop}`;
    root.innerHTML = `
      <div class="win-titlebar">
        <span class="win-icon">${manifest.icon}</span>
        <span class="win-title">${esc(manifest.name)}</span>
        <div class="win-controls">
          <button class="win-min" title="Minimize">–</button>
          <button class="win-max" title="Maximize">□</button>
          <button class="win-close" title="Close">✕</button>
        </div>
      </div>
      <div class="win-body"></div>
      <div class="win-resize"></div>`;

    const body = $('.win-body', root);
    const titleEl = $('.win-title', root);

    const win = {
      id, app: appId, el: root, body, manifest,
      title: manifest.name,
      minimized: false, maximized: false,
      rect: { left, top, width, height },
      instance: null,
      setTitle(t, sub) {
        win.title = t || manifest.name;
        titleEl.innerHTML = esc(win.title) + (sub ? ` <span class="sub">${esc(sub)}</span>` : '');
        syncTaskbar(); report();
      },
      setSubtitle(sub) {
        titleEl.innerHTML = esc(win.title) + (sub ? ` <span class="sub">${esc(sub)}</span>` : '');
      },
      focus() { focusWin(win); },
      close() { closeWin(win); },
      minimize() {
        win.minimized = true; root.classList.add('min');
        if (focusedId === id) { focusedId = null; focusTopMost(); }
        syncTaskbar(); report();
      },
      restore() {
        win.minimized = false; root.classList.remove('min');
        focusWin(win); report();
      },
      maximize(on) {
        const want = on === undefined ? !win.maximized : !!on;
        win.maximized = want;
        root.classList.toggle('max', want);
        if (want) {
          win._prev = { ...win.rect };
          const dr = desktopRect();
          Object.assign(win.rect, { left: 0, top: 0, width: dr.w, height: dr.h });
        } else if (win._prev) {
          Object.assign(win.rect, win._prev);
        }
        applyRect(win);
        syncTaskbar(); report();
      },
      toggleMax() { win.maximize(); },
      applyRect() { applyRect(win); }
    };

    function applyRect(w) {
      w.el.style.left = w.rect.left + 'px';
      w.el.style.top = w.rect.top + 'px';
      w.el.style.width = w.rect.width + 'px';
      w.el.style.height = w.rect.height + 'px';
    }

    win.applyRect = () => applyRect(win);
    win.toggleMax = () => win.maximize();

    const appApi = {
      win, args: args || {}, kernel: WebOS, api, esc, el, on, emit,
      setTitle: win.setTitle,
      setSubtitle: win.setSubtitle,
      notify: WebOS.notify,
      openApp: (a, ar) => WebOS.open(a, ar),
      publishState: (obj) => { appStateFeed[appId] = Object.assign({}, appStateFeed[appId], obj, { ts: Date.now() }); report(); },
      onCommand: null // assigned by app
    };

    $('#windows').appendChild(root);
    open_.push(win);
    wireWindow(win);
    focusedId = id;
    setFocusClass();
    syncTaskbar();

    const inst = manifest.mount(appApi) || {};
    win.instance = inst;
    if (inst.handleCommand) appApi.onCommand = inst.handleCommand;
    emit('window:open', win);
    report();
    return win;
  }

  function applyRect(w) {
    w.el.style.left = w.rect.left + 'px';
    w.el.style.top = w.rect.top + 'px';
    w.el.style.width = w.rect.width + 'px';
    w.el.style.height = w.rect.height + 'px';
  }

  function focusWin(w) {
    if (!w) return;
    if (w.minimized) { w.minimized = false; w.el.classList.remove('min'); }
    focusedId = w.id;
    w.el.style.zIndex = ++zTop;
    setFocusClass(); syncTaskbar(); report();
  }
  function focusTopMost() {
    const vis = open_.filter(w => !w.minimized);
    if (!vis.length) { focusedId = null; setFocusClass(); return; }
    const top = vis.reduce((a, b) => (Number(a.el.style.zIndex) > Number(b.el.style.zIndex) ? a : b));
    focusedId = top.id; setFocusClass();
  }
  function setFocusClass() {
    open_.forEach(w => w.el.classList.toggle('focus', w.id === focusedId));
  }

  function closeWin(w) {
    if (!w) return;
    try { if (w.instance && w.instance.destroy) w.instance.destroy(); } catch (e) {}
    const i = open_.indexOf(w);
    if (i >= 0) open_.splice(i, 1);
    w.el.remove();
    if (focusedId === w.id) { focusedId = null; focusTopMost(); }
    syncTaskbar(); report(); emit('window:close', w);
  }

  function wireWindow(win) {
    const root = win.el;
    const bar = $('.win-titlebar', root);

    root.addEventListener('pointerdown', () => focusWin(win), true);

    $('.win-min', root).onclick = (e) => { e.stopPropagation(); win.minimize(); };
    $('.win-close', root).onclick = (e) => { e.stopPropagation(); win.close(); };
    $('.win-max', root).onclick = (e) => { e.stopPropagation(); win.maximize(); };
    bar.addEventListener('dblclick', (e) => { if (!e.target.closest('.win-controls')) win.maximize(); });

    // drag
    let drag = null;
    bar.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.win-controls')) return;
      if (win.maximized) return;
      drag = { x: e.clientX, y: e.clientY, left: win.rect.left, top: win.rect.top };
      bar.setPointerCapture(e.pointerId);
      win.el.style.transition = 'none';
    });
    bar.addEventListener('pointermove', (e) => {
      if (!drag) return;
      win.rect.left = Math.max(-win.rect.width + 90, drag.left + e.clientX - drag.x);
      win.rect.top = Math.max(0, drag.top + e.clientY - drag.y);
      applyRect(win);
    });
    bar.addEventListener('pointerup', (e) => {
      if (drag) { drag = null; report(); }
      try { bar.releasePointerCapture(e.pointerId); } catch (err) {}
    });

    // resize
    const rz = $('.win-resize', root);
    let rs = null;
    rz.addEventListener('pointerdown', (e) => {
      if (win.maximized) return;
      e.stopPropagation();
      rs = { x: e.clientX, y: e.clientY, w: win.rect.width, h: win.rect.height };
      rz.setPointerCapture(e.pointerId);
    });
    rz.addEventListener('pointermove', (e) => {
      if (!rs) return;
      win.rect.width = Math.max(340, rs.w + e.clientX - rs.x);
      win.rect.height = Math.max(190, rs.h + e.clientY - rs.y);
      applyRect(win);
    });
    rz.addEventListener('pointerup', (e) => {
      rs = null;
      try { rz.releasePointerCapture(e.pointerId); } catch (err) {}
      report();
    });
  }

  /* ---------------- taskbar / start menu / icons ---------------- */
  function syncTaskbar() {
    const list = $('#tasklist');
    if (!list) return;
    list.innerHTML = '';
    open_.forEach(w => {
      const b = el('button', 'task' + (w.id === focusedId && !w.minimized ? ' active' : ''));
      b.dataset.id = w.id;
      b.dataset.app = w.app;
      b.innerHTML = `<span>${w.manifest.icon}</span><span class="t">${esc(w.title)}</span>`;
      b.onclick = () => {
        if (w.minimized) w.restore();
        else if (focusedId === w.id) w.minimize();
        else w.focus();
      };
      list.appendChild(b);
    });
  }

  function buildDesktop() {
    const box = $('#icons');
    box.innerHTML = '';
    ORDER.forEach(id => {
      const m = APPS[id];
      const d = el('div', 'dicon');
      d.dataset.app = id;
      d.innerHTML = `<span class="ic">${m.icon}</span><span class="nm">${esc(m.name)}</span>`;
      d.ondblclick = () => WebOS.open(id);
      d.onclick = () => { $$('.dicon').forEach(x => x.classList.remove('sel')); d.classList.add('sel'); };
      box.appendChild(d);
    });

    const sm = $('#sm-apps');
    sm.innerHTML = '';
    ORDER.forEach(id => {
      const m = APPS[id];
      const a = el('div', 'sm-app');
      a.dataset.app = id;
      a.innerHTML = `<span class="ic">${m.icon}</span><span>${esc(m.name)}</span>`;
      a.onclick = () => { WebOS.open(id); toggleStart(false); };
      sm.appendChild(a);
    });
  }

  function toggleStart(force) {
    const m = $('#startmenu');
    const show = force === undefined ? m.classList.contains('hidden') : force;
    m.classList.toggle('hidden', !show);
  }

  /* ---------------- toasts ---------------- */
  let toastSeq = 0;
  function notify(text, kind, title) {
    const t = el('div', 'toast ' + (kind || ''));
    t.dataset.id = 't' + (++toastSeq);
    t.innerHTML = (title ? `<b>${esc(title)}</b>` : '<b>notification</b>') + esc(text);
    $('#toasts').appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(30px)'; setTimeout(() => t.remove(), 300); }, 5200);
    pushNotification(text, kind, title);
    return t;
  }
  const notifications = [];
  function pushNotification(text, kind, title) {
    notifications.push({ text: String(text), kind: kind || 'info', title: title || '', ts: Date.now() });
    if (notifications.length > 40) notifications.shift();
    report();
  }

  /* ---------------- modal prompt / confirm (sandbox-safe) ---------------- */
  function modal(html, { input = false, value = '', placeholder = '' } = {}) {
    return new Promise((resolve) => {
      const back = el('div', '');
      back.style.cssText = 'position:absolute;inset:0;background:rgba(4,6,12,.55);backdrop-filter:blur(3px);z-index:900;display:flex;align-items:center;justify-content:center';
      const box = el('div', '');
      box.style.cssText = 'width:min(420px,86vw);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px';
      box.innerHTML = `<div style="font-size:13px;margin-bottom:12px">${esc(html)}</div>`;
      let inp = null;
      if (input) {
        inp = el('input', 'inp');
        inp.value = value; inp.placeholder = placeholder || '';
        inp.style.cssText = 'width:100%;margin-bottom:14px';
        box.appendChild(inp);
      }
      const row = el('div', '');
      row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end';
      const no = el('button', 'tb-btn', input ? 'Cancel' : 'No');
      const yes = el('button', 'tb-btn primary', input ? 'OK' : 'Yes');
      row.appendChild(no); row.appendChild(yes);
      box.appendChild(row);
      back.appendChild(box);
      $('#desktop').appendChild(back);
      const done = (v) => { back.remove(); document.removeEventListener('keydown', key); resolve(v); };
      const key = (e) => {
        if (e.key === 'Escape') done(null);
        if (e.key === 'Enter') done(input ? inp.value : true);
      };
      document.addEventListener('keydown', key);
      no.onclick = () => done(null);
      yes.onclick = () => done(input ? inp.value : true);
      back.onclick = (e) => { if (e.target === back) done(null); };
      setTimeout(() => { (inp || yes).focus(); if (inp) inp.select(); }, 40);
    });
  }
  /* ---------------- theme / wallpaper ---------------- */
  const WALLS = {
    'aurora': null,
    'deep space': 'radial-gradient(1000px 700px at 20% 15%, #10204f 0%, transparent 60%), linear-gradient(160deg,#05060a,#0d1120 60%,#05060a)',
    'violet': 'radial-gradient(900px 700px at 80% 20%, #5b2a8a 0%, transparent 55%), linear-gradient(200deg,#100818,#1b1030)',
    'sunset': 'linear-gradient(160deg,#2b1055,#7597de 60%,#ffb56b)',
    'forest': 'radial-gradient(1100px 700px at 25% 20%, #0f3d2e 0%, transparent 60%), linear-gradient(160deg,#05100c,#0d2420)',
    'paper': 'linear-gradient(160deg,#f7f9ff,#e6ebf7)'
  };
  function setWallpaper(css) {
    const wp = $('#wallpaper');
    document.documentElement.style.setProperty('--wall', css || '');
    wp.style.background = css || '';
    settings.wallpaper = css;
    store('wallpaper', css);
    report();
  }
  function setTheme(mode) {
    settings.theme = mode === 'light' ? 'light' : 'dark';
    document.body.className = 'theme-' + settings.theme;
    store('theme', settings.theme);
    report();
  }
  function setAccent(hex) {
    settings.accent = hex;
    document.documentElement.style.setProperty('--accent', hex);
    store('accent', hex);
    report();
  }

  /* ---------------- state reporting (for the agent) ---------------- */
  let reportTimer = null;
  function report() {
    if (reportTimer) return;
    reportTimer = setTimeout(() => {
      reportTimer = null;
      emit('state', WebOS.state());
    }, 120);
  }

  function winState(w) {
    return {
      id: w.id, app: w.app, title: w.title, focused: w.id === focusedId,
      minimized: !!w.minimized, maximized: !!w.maximized,
      rect: { left: Math.round(w.rect.left), top: Math.round(w.rect.top), width: Math.round(w.rect.width), height: Math.round(w.rect.height) }
    };
  }

  /* ---------------- command routing (used by bridge.js) ---------------- */
  function findWindow(target) {
    if (!target) return open_.find(w => w.id === focusedId && !w.minimized) || open_.filter(w => !w.minimized).slice(-1)[0];
    if (typeof target === 'string' && target.startsWith('w')) {
      const byId = open_.find(w => w.id === target);
      if (byId) return byId;
    }
    const appId = (target.app || target.appId || target.id || target);
    const matches = open_.filter(w => w.app === appId);
    return matches.length ? matches[matches.length - 1] : null;
  }

  async function handleCommand(cmd) {
    const op = String(cmd.op || '').toLowerCase();
    const args = cmd.args || {};
    const own = (extra) => Object.assign({ id: cmd.id, op, handledBy: 'kernel' }, extra || {});

    switch (op) {
      case 'open': {
        const appId = (cmd.app || args.app || args.id || '').toLowerCase();
        if (!APPS[appId]) return own({ ok: false, error: 'unknown app: ' + appId, available: ORDER });
        const w = WebOS.open(appId, args);
        return own({ ok: !!w, windowId: w && w.id, app: appId, title: w && w.title });
      }
      case 'close': {
        const w = findWindow(args.window || args.target || cmd.window || args.app);
        if (!w) return own({ ok: false, error: 'window not found' });
        w.close();
        return own({ ok: true, closed: w.id });
      }
      case 'closeall': {
        const n = open_.length;
        [...open_].forEach(w => w.close());
        return own({ ok: true, closed: n });
      }
      case 'focus': {
        const w = findWindow(args.window || args.target || args.app);
        if (!w) return own({ ok: false, error: 'window not found' });
        w.focus();
        return own({ ok: true, windowId: w.id, app: w.app });
      }
      case 'minimize': {
        const w = findWindow(args.window || args.app);
        if (!w) return own({ ok: false, error: 'window not found' });
        w.minimize();
        return own({ ok: true, windowId: w.id });
      }
      case 'maximize': case 'restore': {
        const w = findWindow(args.window || args.app);
        if (!w) return own({ ok: false, error: 'window not found' });
        if (op === 'maximize') w.maximize(args.on === undefined ? true : args.on);
        else { w.minimized = false; w.el.classList.remove('min'); w.maximize(false); w.focus(); }
        return own({ ok: true, windowId: w.id, maximized: w.maximized });
      }
      case 'move': {
        const w = findWindow(args.window || args.app);
        if (!w) return own({ ok: false, error: 'window not found' });
        ['left', 'top', 'width', 'height'].forEach(k => { if (typeof args[k] === 'number') w.rect[k] = args[k]; });
        w.applyRect();
        report();
        return own({ ok: true, windowId: w.id, rect: w.rect });
      }
      case 'windows': case 'list':
        return own({ ok: true, windows: open_.map(winState) });
      case 'notify':
        notify(args.text || args.message || 'notification', args.kind || 'ok', args.title);
        return own({ ok: true, text: args.text || '' });
      case 'wallpaper':
        setWallpaper(args.css || args.wallpaper || args.value);
        return own({ ok: true, wallpaper: settings.wallpaper });
      case 'theme':
        if (args.accent) setAccent(args.accent);
        if (args.mode || args.theme) setTheme(args.mode || args.theme);
        return own({ ok: true, theme: settings.theme, accent: settings.accent });
      case 'titlebar': {
        const w = findWindow(args.window || args.app);
        if (!w) return own({ ok: false, error: 'window not found' });
        w.setTitle(args.title || w.title);
        return own({ ok: true });
      }
      case 'apps':
        return own({ ok: true, apps: ORDER.map(id => ({ id, name: APPS[id].name, icon: APPS[id].icon })) });
    }

    // app-specific ops (navigate / back / click / type / read / ...)
    const preferredApp = cmd.app || args.app;
    let target = null;
    if (preferredApp) target = open_.filter(w => w.app === preferredApp).slice(-1)[0];
    if (!target) target = open_.find(w => w.id === focusedId);
    if (!target) target = open_.slice(-1)[0];

    if (target && target.instance && target.instance.handleCommand) {
      try {
        const res = await target.instance.handleCommand(cmd, target);
        if (res) return Object.assign({ id: cmd.id, op, handledBy: target.app, windowId: target.id }, res);
      } catch (e) {
        return own({ ok: false, error: 'app error: ' + e.message });
      }
    }

    // generic DOM ops fallback (click/type/query inside the OS itself)
    if (['click', 'type', 'query', 'key'].includes(op)) {
      return own(domCommand(op, args));
    }

    return own({ ok: false, error: 'unknown op: ' + op, openWindows: open_.map(w => w.app) });
  }

  function domCommand(op, args) {
    const sel = args.selector || args.sel;
    try {
      if (op === 'click') {
        const node = sel ? document.querySelector(sel) : null;
        if (!node) return { ok: false, error: 'selector not found: ' + sel };
        node.click();
        return { ok: true, clicked: sel };
      }
      if (op === 'type') {
        const node = sel ? document.querySelector(sel) : null;
        if (!node) return { ok: false, error: 'selector not found: ' + sel };
        node.focus();
        if ('value' in node) {
          node.value = String(args.text || '');
          node.dispatchEvent(new Event('input', { bubbles: true }));
          node.dispatchEvent(new Event('change', { bubbles: true }));
          if (args.submit) {
            const ev = new KeyboardEvent('keydown', { key: 'Enter', keyCode: 13, bubbles: true });
            node.dispatchEvent(ev);
            if (node.form && node.form.requestSubmit) { try { node.form.requestSubmit(); } catch (e) {} }
          }
        }
        return { ok: true, typed: sel };
      }
      if (op === 'query') {
        const nodes = sel ? Array.from(document.querySelectorAll(sel)) : [];
        return {
          ok: true, count: nodes.length,
          items: nodes.slice(0, 60).map(n => ({
            tag: n.tagName.toLowerCase(), text: (n.innerText || n.value || '').slice(0, 200).trim(),
            rect: (() => { const r = n.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]; })()
          }))
        };
      }
      if (op === 'key') {
        const target = document.activeElement || document.body;
        const k = args.key || 'Enter';
        target.dispatchEvent(new KeyboardEvent('keydown', { key: k, keyCode: args.keyCode || 13, bubbles: true }));
        target.dispatchEvent(new KeyboardEvent('keyup', { key: k, bubbles: true }));
        return { ok: true, key: k };
      }
    } catch (e) { return { ok: false, error: e.message }; }
    return { ok: false, error: 'unsupported dom op' };
  }

  /* ---------------- boot ---------------- */
  function boot() {
    const sTheme = store('theme'); if (sTheme) settings.theme = sTheme;
    const sWall = store('wallpaper'); if (sWall) settings.wallpaper = sWall;
    const sAccent = store('accent'); if (sAccent) settings.accent = sAccent;
    setTheme(settings.theme);
    setAccent(settings.accent);
    if (settings.wallpaper && !Object.prototype.hasOwnProperty.call(WALLS, settings.wallpaper)) setWallpaper(settings.wallpaper);

    buildDesktop();
    $('#startBtn').onclick = () => toggleStart();
    $('#themeBtn').onclick = () => setTheme(settings.theme === 'dark' ? 'light' : 'dark');
    $('#smLock').onclick = () => location.reload();
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#startmenu') && !e.target.closest('#startBtn')) toggleStart(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.code === 'Space') { e.preventDefault(); toggleStart(); }
      if (e.ctrlKey && e.key.toLowerCase() === 'w' && focusedId) { e.preventDefault(); const w = open_.find(x => x.id === focusedId); if (w) w.close(); }
    });
    setInterval(() => { $('#clock').textContent = nowTime(); }, 1000);
    $('#clock').textContent = nowTime();
    window.addEventListener('resize', () => {
      const dr = desktopRect();
      open_.forEach(w => {
        if (w.maximized) { w.rect.width = dr.w; w.rect.height = dr.h; applyRect(w); }
        else {
          w.rect.left = Math.min(w.rect.left, Math.max(0, dr.w - 120));
          w.rect.top = Math.min(w.rect.top, Math.max(0, dr.h - 60));
          w.rect.width = Math.min(w.rect.width, dr.w);
          w.rect.height = Math.min(w.rect.height, dr.h);
          applyRect(w);
        }
      });
    });

    // welcome layout: browser + agent console side by side
    setTimeout(() => {
      const dr = desktopRect();
      const browser = WebOS.open('browser', { url: 'https://example.com' });
      if (browser) {
        browser.rect = { left: 12, top: 10, width: Math.round(dr.w * 0.66), height: Math.round(dr.h - 24) };
        browser.applyRect(); browser.focus();
      }
      const agent = WebOS.open('agent');
      if (agent) {
        agent.rect = { left: Math.round(dr.w * 0.66) + 22, top: 10, width: Math.round(dr.w * 0.32) - 24, height: Math.round((dr.h - 24) * 0.52) };
        agent.applyRect();
      }
    }, 260);

    if (window.WEBOS_LOCAL) {
      WebOS.notify('Local mode — sab kuch browser ke andar. Console me WebOS.handleCommand({op:"open",app:"files"}) try karo.', 'ok', 'WebOS 1.0 (single file)');
    } else {
      WebOS.notify('Agent bus ready. /api/agent/cmd se OS control karo.', 'ok', 'WebOS 1.0');
    }
    emit('boot');
  }

  /* ---------------- public kernel object ---------------- */
  const WebOS = {
    version: '1.0.0',
    boot, registerApp, open: createWindow, notify, api, on, emit,
    settings, WALLS,
    setTheme, setWallpaper, setAccent,
    handleCommand,
    toggleStart,
    get windows() { return open_.map(winState); },
    get instances() { return open_; },
    focused() { return open_.find(w => w.id === focusedId) || null; },
    findWindow,
    report,
    state() {
      const feed = {};
      open_.forEach(w => {
        if (w.instance && typeof w.instance.state === 'function') {
          try { feed[w.app] = w.instance.state(); } catch (e) { feed[w.app] = { error: e.message }; }
        }
      });
      return {
        os: 'WebOS', version: '1.0.0',
        theme: settings.theme, accent: settings.accent,
        wallpaper: settings.wallpaper,
        focused: focusedId,
        windows: open_.map(winState),
        apps: ORDER.map(id => ({ id, name: APPS[id].name, icon: APPS[id].icon })),
        desktopIcons: ORDER.map(id => ({ app: id, name: APPS[id].name, selector: `.dicon[data-app="${id}"]` })),
        notifications: notifications.slice(-10),
        appState: feed,
        ts: Date.now()
      };
    }
  };

  WebOS.prompt = (text, value, placeholder) => modal(text, { input: true, value: value || '', placeholder });
  WebOS.confirm = (text) => modal(text, { input: false }).then(v => !!v);
  WebOS.modal = modal;

  window.WebOS = WebOS;
})();

</script>
<script>

/* local bridge: no server to talk to, so the agent pill shows "local"
   and WebOS.bridge stays API-compatible with the server build. */
(function(){
  if (!window.WEBOS_LOCAL) return;
  function setPill(){
    var p = document.getElementById('agentPill');
    var t = document.getElementById('agentPillText');
    if (p) p.classList.add('on');
    if (t) t.textContent = 'local';
    if (p) p.title = 'Local mode — single-file build. Server deploy karne par live agent API milti hai.';
  }
  document.addEventListener('DOMContentLoaded', function(){ setTimeout(setPill, 900); });
  window.WebOS.bridge = {
    clientId: 'local',
    connected: function(){ return false; },
    history: function(){ return (window.WebOSLocal && WebOSLocal.log() || []).filter(function(e){ return e.kind === 'cmd' || e.kind === 'ok' || e.kind === 'error'; }).slice(-30).map(function(e){ return { op: e.text, ok: e.kind !== 'error', ms: 0, ts: e.ts }; }); },
    reconnect: function(){}
  };
  window.WebOS.isLocal = true;
  /* console se agent ki tarah OS chalane ke liye chhota helper */
  window.agent = function(op, args, app){
    return WebOS.handleCommand({ op: op, args: args || {}, app: app });
  };
})();

</script>

      const omni = el('.cr-url', root);
